threats:
  - id: CCC.SecMgmt.TH01
    group: Encryption
    title: Secret Values are Exposed Outside the Service
    description: |
      A secret value retrieved through the API or command-line interface may be
      written to terminal output, shell history, build logs, environment
      variables, or application logs, or may be readable by any identity holding
      a broad read permission on the secret. Plaintext copies of the value then
      exist outside the service's access control and audit trail. The
      confidentiality of the credential is lost, and the credential could be
      used to access the systems it protects.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.CP01
            remarks: Secret Storage
          - reference-id: CCC.SecMgmt.CP02
            remarks: Secret Creation - Plaintext
          - reference-id: CCC.SecMgmt.CP04
            remarks: Secret Creation - Binary Data
          - reference-id: CCC.Core.CP06
            remarks: Access Control
          - reference-id: CCC.Core.CP14
            remarks: API Access
          - reference-id: CCC.Core.CP28
            remarks: Command-line Interface

  - id: CCC.SecMgmt.TH02
    group: Access
    title: Secret Values are Replaced by Unauthorized Entities
    description: |
      Write permission on a secret may be granted more broadly than read
      permission, or may be obtained through a compromised identity, allowing
      a new version to be stored with a value chosen by the writer. External
      systems that consume the secret then authenticate with the substituted
      credential or connect to an endpoint named in it, redirecting data to an
      unintended destination or failing to authenticate. The integrity of the
      credential and the availability of the systems that depend on it are
      affected.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.CP05
            remarks: Update Secrets
          - reference-id: CCC.Core.CP06
            remarks: Access Control
          - reference-id: CCC.Core.CP18
            remarks: Resource Versioning

  - id: CCC.SecMgmt.TH03
    group: Access
    title: Secrets are Not Rotated or Rotation Fails
    description: |
      A rotation schedule may be absent, the rotation function may fail, or a
      rotation-due notification may go unanswered where the provider only
      notifies an external system. A credential then remains valid for an
      unbounded period, so a compromise that is never detected keeps granting
      access, while a partially completed rotation can leave external systems
      holding a credential that the target no longer accepts. Confidentiality
      of the protected systems and availability of their consumers are
      affected.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.CP07
            remarks: Scheduled Secret Rotation
          - reference-id: CCC.Core.CP07
            remarks: Event Publication
          - reference-id: CCC.Core.CP18
            remarks: Resource Versioning
          - reference-id: CCC.Core.CP34
            remarks: Data Lifecycle Policy

  - id: CCC.SecMgmt.TH04
    group: Data
    title: Secret Versions are Disabled or Destroyed Prematurely
    description: |
      A secret version may be disabled, scheduled for deletion, or expired by a
      lifecycle policy while external systems still depend on it, and a
      destroyed version cannot be recovered once its recovery window elapses.
      Retrieval requests then fail or return no current version, and the
      credential material is lost if no other copy exists. The availability of
      every system that depends on the secret is affected.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.CP10
            remarks: Secret Version Disabling
          - reference-id: CCC.Core.CP18
            remarks: Resource Versioning
          - reference-id: CCC.Core.CP32
            remarks: Deletion Protection
          - reference-id: CCC.Core.CP34
            remarks: Data Lifecycle Policy
