controls:
  - id: CCC.SecMgmt.CN01
    group: Access
    title: Enforce Scheduled Secret Rotation
    objective: |
      Ensure that secrets are rotated on a defined schedule to
      reduce the risk of secret compromise and unauthorized access.
    assessment-requirements:
      - id: CCC.SecMgmt.CN01.AR01
        text: |
          When a secret is stored, a rotation schedule MUST be configured
          with an interval of 90 days or less.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure the provider's rotation schedule on every secret. Where
          the provider only publishes a rotation-due event, subscribe an
          external rotation function to it. No provider enforces a secret
          expiry on retrieval, so the schedule is the only control that
          bounds a credential's lifetime.
      - id: CCC.SecMgmt.CN01.AR02
        text: |
          When a scheduled rotation has not produced a new secret version
          within 24 hours of its due time, an alert MUST be published to a
          monitored channel.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Alert on rotation-failure events from the rotation function and on
          rotation-due events that are not followed by a version-created
          event within the tolerance window. Where the provider has no
          rotation schedule and only publishes a near-expiry event, treat the
          expiry date as the due time and alert when no new version exists
          24 hours before it.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.TH03
            strength: 0 # Not yet specified
            remarks: Secrets are Not Rotated or Rotation Fails
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.AC-1
            remarks: Identities and credentials are issued, managed, verified, revoked, and audited
      - reference-id: NIST_800_53
        entries:
          - reference-id: IA-5
            strength: 0 # Not yet specified
            remarks: Authenticator Management

  - id: CCC.SecMgmt.CN03
    group: Access
    title: Enforce Least-Privilege Access to Secret Values
    objective: |
      Ensure that only the identities that consume a secret can read its
      value, and that an identity which only consumes a secret cannot
      replace its value.
    assessment-requirements:
      - id: CCC.SecMgmt.CN03.AR01
        text: |
          When a secret's access policy is configured, read permission on the
          secret value MUST NOT be granted to a wildcard principal.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Review resource policies, vault access policies, and IAM bindings
          for grants to all identities in the account or organization.
      - id: CCC.SecMgmt.CN03.AR02
        text: |
          When read permission on a secret value is granted, the grant MUST
          be scoped to the specific secret, vault, or tag-scoped set of
          secrets that the identity consumes.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Grant secret read permission per secret, per vault, or per tag
          group rather than on all secrets in the account.
      - id: CCC.SecMgmt.CN03.AR03
        text: |
          When an identity is granted read permission on a secret value for
          consumption by a workload, that grant MUST NOT include permission
          to create a new version of the secret.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Give consuming workloads a read-only role. Rotation functions and
          deployment pipelines may hold both read and write permission, since
          a rotation function must read the current value to replace it.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.TH01
            strength: 0 # Not yet specified
            remarks: Secret Values are Exposed Outside the Service
          - reference-id: CCC.SecMgmt.TH02
            strength: 0 # Not yet specified
            remarks: Secret Values are Replaced by Unauthorized Entities
          - reference-id: CCC.Core.TH01
            strength: 0 # Not yet specified
            remarks: Access is Granted to Unauthorized Users
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.AC-4
            remarks: Access permissions and authorizations are managed
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-6
            strength: 0 # Not yet specified
            remarks: Least Privilege

  - id: CCC.SecMgmt.CN04
    group: Data
    title: Protect Secret Versions from Premature Loss
    objective: |
      Ensure that a secret version cannot be destroyed before dependent
      systems have moved off it, and that disabling or scheduling the
      destruction of a version is observed.
    assessment-requirements:
      - id: CCC.SecMgmt.CN04.AR01
        text: |
          When a secret or secret version is deleted, the service MUST retain
          it in a recoverable state for at least 7 days before destruction.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Set the deletion recovery window, soft-delete retention, or
          version destroy TTL to 7 days or more and do not permit
          force-delete without recovery. Providers differ in which half they
          can meet: a secret-level recovery window exists on AWS (7-30 days)
          and Azure (soft delete, 7-90 days) but not GCP, which deletes a
          secret immediately; a version-level window exists on GCP (version
          destroy TTL) and Azure but not AWS, which purges a deprecated
          version without a recovery window. Assess each provider on the
          half it offers.
      - id: CCC.SecMgmt.CN04.AR02
        text: |
          When a secret version is disabled or scheduled for destruction, an
          alert MUST be published to a monitored channel.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Subscribe the security team's alerting channel to the provider's
          event stream for version disable, delete, and expiry events.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.SecMgmt.TH04
            strength: 0 # Not yet specified
            remarks: Secret Versions are Disabled While Systems Still Depend on Them
          - reference-id: CCC.Core.TH06
            strength: 0 # Not yet specified
            remarks: Data is Lost or Corrupted
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: RS.AN-1
            remarks: Notifications from detection systems are investigated
      - reference-id: NIST_800_53
        entries:
          - reference-id: CP-10
            strength: 0 # Not yet specified
            remarks: System Recovery and Reconstitution
          - reference-id: IR-5
            strength: 0 # Not yet specified
            remarks: Incident Monitoring
