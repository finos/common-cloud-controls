capabilities:
  - id: CCC.KeyMgmt.CP01
    group: Encryption
    title: AES-256
    description: |
      The service can create and use symmetric keys that implement the Advanced
      Encryption Standard (AES) with a 256-bit key for encryption and decryption.
  - id: CCC.KeyMgmt.CP02
    group: Encryption
    title: RSA-2048
    description: |
      The service can create and use RSA keys with a 2048-bit modulus for
      encryption and digital signatures.
  - id: CCC.KeyMgmt.CP03
    group: Encryption
    title: RSA-3072
    description: |
      The service can create and use RSA keys with a 3072-bit modulus for
      encryption and digital signatures.
  - id: CCC.KeyMgmt.CP04
    group: Encryption
    title: RSA-4096
    description: |
      The service can create and use RSA keys with a 4096-bit modulus for
      encryption and digital signatures.
  - id: CCC.KeyMgmt.CP05
    group: Encryption
    title: EC-P256
    description: |
      The service can create and use elliptic curve keys on the NIST P-256
      curve for digital signatures.
  - id: CCC.KeyMgmt.CP06
    group: Encryption
    title: EC-P256K
    description: |
      The service can create and use elliptic curve keys on the secp256k1
      curve for digital signatures.
  - id: CCC.KeyMgmt.CP07
    group: Encryption
    title: EC-P384
    description: |
      The service can create and use elliptic curve keys on the NIST P-384
      curve for digital signatures.
  - id: CCC.KeyMgmt.CP08
    group: Encryption
    title: Key Creation
    description: |
      The service can generate key material within its own boundary using any
      supported algorithm, so that private key material is never exposed to
      the user.
  - id: CCC.KeyMgmt.CP09
    group: Encryption
    title: Encrypt Data
    description: |
      The service can encrypt data submitted by a user with a managed key and
      return the ciphertext without exposing the key material.
  - id: CCC.KeyMgmt.CP10
    group: Encryption
    title: Decrypt Data
    description: |
      The service can decrypt ciphertext submitted by a user with a managed key
      and return the plaintext without exposing the key material.
  - id: CCC.KeyMgmt.CP11
    group: Encryption
    title: Create Digital Signature
    description: |
      The service can generate a digital signature over data or a digest
      submitted by a user with a managed asymmetric key.
  - id: CCC.KeyMgmt.CP12
    group: Encryption
    title: Verify Digital Signature
    description: |
      The service can verify a digital signature over data or a digest
      submitted by a user with the public half of a managed asymmetric key.
  - id: CCC.KeyMgmt.CP13
    group: Encryption
    title: FIPS 140 Level 3 Hardware Security Modules
    description: |
      The service may be configured to generate and store keys in hardware
      security modules validated to FIPS 140-2 Level 3 or FIPS 140-3 Level 3,
      so that key material never exists in plaintext outside the module.
  - id: CCC.KeyMgmt.CP16
    group: Encryption
    title: Disable Key
    description: |
      The service can disable a managed key or key version so that
      cryptographic operations with it are rejected until it is re-enabled,
      without deleting the key material.
  - id: CCC.KeyMgmt.CP17
    group: Encryption
    title: Enable Key
    description: |
      The service can re-enable a disabled managed key or key version so that
      cryptographic operations with it resume.
  - id: CCC.KeyMgmt.CP19
    group: Encryption
    title: Delete Key
    description: |
      The service can permanently destroy a managed key or key version once
      the deletion-protection recovery window has elapsed, after which data
      protected by it can no longer be decrypted.
  - id: CCC.KeyMgmt.CP20
    group: Encryption
    title: Automatic Symmetric Key Rotation
    description: |
      The service may be configured to automatically generate new key material
      for a symmetric key at a user-defined interval, provided the key material
      was generated within the service, while retaining prior versions for
      decryption.
  - id: CCC.KeyMgmt.CP21
    group: Encryption
    title: Manual Key Rotation
    description: |
      The service can rotate a managed key on demand by generating a new key
      version, while retaining prior versions for decryption.
  - id: CCC.KeyMgmt.CP22
    group: Encryption
    title: Key Import
    description: |
      The service can import key material generated outside the service,
      wrapped under a service-provided wrapping key, so that it can be used as
      a managed key.
  - id: CCC.KeyMgmt.CP25
    group: Encryption
    title: Key Usage Restriction
    description: |
      The service may be configured to restrict a key to a declared set of
      operations, such as encrypt and decrypt or sign and verify, and rejects
      requests for operations outside that set.
  - id: CCC.KeyMgmt.CP26
    group: Encryption
    title: Message Authentication Code Generation and Verification
    description: |
      The service can generate and verify hash-based message authentication
      codes (HMAC) over data submitted by a user with a managed symmetric key,
      so that the MAC key never leaves the service.
  - id: CCC.KeyMgmt.CP27
    group: Encryption
    title: External Key Store
    description: |
      The service may be configured to perform cryptographic operations with
      keys held in a key manager outside the provider's infrastructure, so that
      the user retains sole custody of the key material. Where a provider lacks
      this, key material custody cannot be kept outside the provider.
