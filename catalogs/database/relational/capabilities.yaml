capabilities:
  - id: CCC.RDMS.CP01
    group: Data
    title: SQL Support
    description: |
      Properly handle queries in the SQL language.

  - id: CCC.RDMS.CP02
    group: Data
    title: DB Engine Option - MySQL
    description: |
      Ability to create a MySQL managed relational database.

  - id: CCC.RDMS.CP03
    group: Data
    title: DB Engine Option - PostgreSQL
    description: |
      Ability to create a PostgreSQL managed relational database.

  - id: CCC.RDMS.CP05
    group: Data
    title: DB Engine Option - SQL Server
    description: |
      Ability to create a Microsoft SQL Server managed relational database.

  - id: CCC.RDMS.CP07
    group: Access
    title: DB Self Managed Credentials
    description: |
      Ability to manage the database credentials by client managed
      username and passwords.

  - id: CCC.RDMS.CP08
    group: Networking
    title: Support for IPv4
    description: |
      Ability to connect to the database using IPv4 addresses.

  - id: CCC.RDMS.CP09
    group: Networking
    title: Support for IPv6
    description: |
      Ability to connect to the database using IPv6 addresses

  - id: CCC.RDMS.CP12
    group: Networking
    title: Managed Connection Pooling
    description: |
      Ability to configure a managed connection pool for the database.

  - id: CCC.RDMS.CP14
    group: Compute
    title: Dedicated Database Instances
    description: |
      Option to deploy the database on a dedicated instance for
      isolation requirements.

  - id: CCC.RDMS.CP15
    group: Data
    title: Horizontal Scaling
    description: |
      Read replicas of the primary database can be created.

  - id: CCC.RDMS.CP16
    group: Data
    title: Failover
    description: |
      Standby database can be implemented for failover when the
      primary can't be reached.

  - id: CCC.RDMS.CP17
    group: Access
    title: Cloud Identity Authentication
    description: |
      The service may be configured to authenticate database users with
      short-lived tokens issued to the cloud provider's identity principals,
      so that no long-lived database password needs to be stored or rotated.

  - id: CCC.RDMS.CP18
    group: Compute
    title: Automated Engine Patching
    description: |
      The service automatically applies database engine security patches and
      minor version upgrades during a maintenance window, or may be configured
      to do so, to limit exposure to known engine vulnerabilities.
