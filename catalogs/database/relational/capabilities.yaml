capabilities:
  - id: CCC.RDMS.CP01
    group: Data
    title: SQL Support
    description: |
      The service always accepts and executes queries written in the SQL
      language for data definition, manipulation, and retrieval.

  - id: CCC.RDMS.CP02
    group: Data
    title: DB Engine Option - MySQL
    description: |
      The service can provision a managed relational database running the
      MySQL engine.

  - id: CCC.RDMS.CP03
    group: Data
    title: DB Engine Option - PostgreSQL
    description: |
      The service can provision a managed relational database running the
      PostgreSQL engine.

  - id: CCC.RDMS.CP05
    group: Data
    title: DB Engine Option - SQL Server
    description: |
      The service can provision a managed relational database running the
      Microsoft SQL Server engine.

  - id: CCC.RDMS.CP07
    group: Access
    title: DB Self Managed Credentials
    description: |
      The service always supports database users authenticated by a username
      and password that the user creates and manages.

  - id: CCC.RDMS.CP08
    group: Networking
    title: Support for IPv4
    description: |
      The service always exposes an IPv4 endpoint through which clients
      connect to the database.

  - id: CCC.RDMS.CP09
    group: Networking
    title: Support for IPv6
    description: |
      The service may be configured to expose an IPv6 endpoint through which
      clients connect to the database. Cloud SQL does not offer this.

  - id: CCC.RDMS.CP12
    group: Networking
    title: Managed Connection Pooling
    description: |
      The service may be configured to place a managed connection pool in
      front of the database so that client connections are reused and
      bounded.

  - id: CCC.RDMS.CP15
    group: Data
    title: Horizontal Scaling
    description: |
      The service may be configured to create read replicas of the primary
      database, in the same or another region, to serve read traffic.

  - id: CCC.RDMS.CP16
    group: Data
    title: Failover
    description: |
      The service may be configured to maintain a standby database that is
      automatically promoted when the primary cannot be reached.

  - id: CCC.RDMS.CP17
    group: Access
    title: Cloud Identity Authentication
    description: |
      The service may be configured to authenticate database users with
      short-lived tokens issued to the cloud provider's identity principals,
      so that no long-lived database password needs to be stored or rotated.

  - id: CCC.RDMS.CP18
    group: Compute
    title: Automated Engine Patching
    description: |
      The service may be configured to apply database engine security patches
      and minor version upgrades during a maintenance window, to limit
      exposure to known engine vulnerabilities; on some providers this is
      always on.
