threats:
  - id: CCC.Vector.TH01
    group: Data
    title: Source Data is Reconstructed from Stored Embeddings
    description: |
      Embeddings stored by the service or returned by similarity queries may be
      probed repeatedly by a user with query access, or exported in bulk, and
      inverted with a reconstruction model. The text, images, or personal data
      from which the embeddings were derived are recovered, and the presence of
      specific records in the index is inferred. Confidentiality of the source
      data is lost even though the raw data was never stored in the service.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP01
            remarks: Embedding Storage
          - reference-id: CCC.Vector.CP03
            remarks: Similarity Search
  - id: CCC.Vector.TH02
    group: Ingestion
    title: Index is Poisoned by Crafted Embeddings or Content
    description: |
      Vectors or source content submitted through ingestion endpoints, pulled
      from connected data sources, or vectorized by an integrated embedding
      model may be crafted so that they rank highly for targeted queries.
      Search results are steered toward chosen records or degraded for
      legitimate ones, and downstream applications consume the manipulated
      results. Integrity of the index and of every system that relies on it
      is compromised.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP02
            remarks: Vector Indexing
          - reference-id: CCC.Vector.CP13
            remarks: Integrated Embedding Generation
          - reference-id: CCC.Core.CP29
            remarks: Active Ingestion
          - reference-id: CCC.Core.CP30
            remarks: Passive Ingestion
  - id: CCC.Vector.TH03
    group: Access
    title: Query Results Include Records the Requester is not Authorized to Read
    description: |
      Document-level access controls may be enforced on one query path but not
      applied to vector similarity, hybrid, or metadata-filtered queries, or
      metadata filters may be used to confirm attribute values of records the
      requester cannot retrieve. Records, metadata fields, or correlations
      across vector fields derived from different modalities are returned or
      inferred. Confidentiality of the stored records is lost.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP04
            remarks: Metadata Filtering
          - reference-id: CCC.Vector.CP10
            remarks: Multi-modal Vector Support
          - reference-id: CCC.Vector.CP11
            remarks: Document-Level Access Control
  - id: CCC.Vector.TH04
    group: Data
    title: Queries are Served from a Replaced or Stale Index
    description: |
      The index behind a query endpoint or alias may be swapped, redeployed, or
      re-pointed by an identity with excess permissions, or rebuilt from a
      stale or poisoned source. Queries are answered from an index whose
      contents were not reviewed, and the change is not visible to consuming
      applications. Integrity and availability of search results are
      compromised.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP02
            remarks: Vector Indexing
          - reference-id: CCC.Core.CP06
            remarks: Access Control
          - reference-id: CCC.Core.CP14
            remarks: API Access
  - id: CCC.Vector.TH05
    group: Ingestion
    title: Malformed Vectors Cause Failures or Incorrect Results
    description: |
      Vectors submitted with unexpected dimensionality, numeric type, or
      degenerate values such as NaN, infinity, zero magnitude, or extreme
      magnitude may be accepted when validation is incomplete. Indexing or
      query components fail, or similarity scores are distorted for every
      query that encounters the vector. Availability of the service and
      integrity of results are impacted.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP08
            remarks: Embedding Format Compatibility
          - reference-id: CCC.Vector.CP09
            remarks: Vector Dimension Management
  - id: CCC.Vector.TH06
    group: Data
    title: Search Results are Manipulated via Approximate Search Error
    description: |
      Approximate nearest neighbor algorithms trade recall for speed and return
      results that vary with index structure and tuning parameters. Vectors may
      be positioned so that they are omitted from, or injected into, the
      approximate result set while an exact search would rank them differently,
      allowing records to evade similarity-based detection or to bias generated
      responses. Integrity of search results is compromised.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP02
            remarks: Vector Indexing
          - reference-id: CCC.Vector.CP12
            remarks: Approximate or Exact Search Modes
  - id: CCC.Vector.TH07
    group: MachineLearning
    title: Content is Disclosed to or Altered by an Embedding Model Endpoint
    description: |
      When the service generates embeddings by calling a model endpoint, raw
      content is transmitted to that endpoint and the vectors it returns are
      trusted without verification. A misconfigured, third-party, or
      substituted endpoint receives sensitive content, or returns embeddings
      that misrepresent the content. Confidentiality of the content and
      integrity of the index are compromised.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Vector.CP13
            remarks: Integrated Embedding Generation
          - reference-id: CCC.Core.CP29
            remarks: Active Ingestion
