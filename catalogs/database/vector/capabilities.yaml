capabilities:
  - id: CCC.Vector.CP01
    group: Data
    title: Embedding Storage
    description: |
      The service always stores high-dimensional vector embeddings, derived from
      raw input such as text, images, or audio, together with the record they
      represent.

  - id: CCC.Vector.CP02
    group: Data
    title: Vector Indexing
    description: |
      The service may be configured to build indexes optimized for similarity
      search, such as HNSW, IVF, or product-quantized structures, with
      user-selected algorithm and tuning parameters.

  - id: CCC.Vector.CP03
    group: Data
    title: Similarity Search
    description: |
      The service always answers nearest-neighbor queries by taking a query
      embedding and returning the stored vectors most similar to it.

  - id: CCC.Vector.CP04
    group: Data
    title: Metadata Filtering
    description: |
      The service can apply structured filters on metadata fields alongside a
      vector similarity query to restrict the candidate set before or after
      ranking.

  - id: CCC.Vector.CP08
    group: Data
    title: Embedding Format Compatibility
    description: |
      The service can store vector values in standard numeric formats, such as
      32-bit floating point or quantized byte and binary representations, so that
      embeddings produced by any external embedding model can be loaded without
      transformation.

  - id: CCC.Vector.CP09
    group: Data
    title: Vector Dimension Management
    description: |
      The service always enforces a fixed vector dimensionality per index or
      field, declared when the index is created, and rejects vectors that do
      not match it.

  - id: CCC.Vector.CP10
    group: Data
    title: Multi-modal Vector Support
    description: |
      The service can store more than one vector field per record, so that
      embeddings produced from different modalities (such as text and image)
      or different models are searchable together.

  - id: CCC.Vector.CP11
    group: Access
    title: Document-Level Access Control
    description: |
      The service may be configured to restrict which stored records and
      metadata fields a user can retrieve, so that query results are trimmed
      to the records the requester is authorized to see.

  - id: CCC.Vector.CP12
    group: Data
    title: Approximate or Exact Search Modes
    description: |
      The service can run a query either with an approximate nearest neighbor
      (ANN) algorithm for speed or with an exhaustive exact search for
      precision-critical applications.

  - id: CCC.Vector.CP13
    group: MachineLearning
    title: Integrated Embedding Generation
    description: |
      The service may be configured to call an embedding model to vectorize
      content at ingestion or query time, so that raw text or media is sent to
      a model endpoint instead of pre-computed vectors.
