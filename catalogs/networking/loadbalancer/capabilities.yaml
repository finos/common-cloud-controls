capabilities:
  - id: CCC.LB.CP01
    group: Networking
    title: Static Load Balancing
    description: |
      The service can employ load balancing algorithms that follow fixed rules,
      such as round robin, independent of the current server state.
  - id: CCC.LB.CP02
    group: Networking
    title: Dynamic Load Balancing
    description: |
      The service can employ load balancing algorithms that consider the current
      state of servers before distributing traffic, adjusting the distribution in
      real time based on server health, resource utilization, and traffic conditions.
  - id: CCC.LB.CP03
    group: Networking
    title: Layer 7 Routing
    description: |
      The service can distribute incoming traffic based on application layer
      (OSI layer 7) information. Some of the supported protocols on layer 7 are
      HTTP, HTTPS, HTTP/2, gRPC, and WebSockets.
  - id: CCC.LB.CP04
    group: Networking
    title: Layer 4 Routing
    description: |
      The service can distribute incoming traffic based on transport layer
      (OSI layer 4) information, using the combination of IP addresses and
      TCP/UDP ports rather than inspecting the content of the packets.
  - id: CCC.LB.CP05
    group: Networking
    title: URL-Based Routing
    description: |
      The service can direct incoming requests to different backend resources
      based on the content of the request URL.
  - id: CCC.LB.CP06
    group: Networking
    title: HTTP Header-Based Routing
    description: |
      The service can direct incoming requests to different backend resources
      based on the values of HTTP headers.
  - id: CCC.LB.CP07
    group: Networking
    title: WebSocket Support
    description: |
      The service can proxy WebSocket connections between clients and backend
      targets.
  - id: CCC.LB.CP08
    group: Networking
    title: Dual-stack Load Balancing
    description: |
      The service can accept traffic originating from both IPv4 and IPv6 clients
      on the same frontend.
  - id: CCC.LB.CP11
    group: Encryption
    title: SSL/TLS Termination
    description: |
      The service can decrypt SSL or TLS encrypted traffic at the load balancer
      rather than at the backend servers, offloading the decryption task from
      the backend servers.
  - id: CCC.LB.CP12
    group: Observability
    title: Target Health Checks
    description: |
      The service can continuously perform health checks on backend targets by
      checking the response to an HTTP request, a TCP connection, or another
      application-specific parameter.
  - id: CCC.LB.CP13
    group: Networking
    title: Health Checks-based Target Removal
    description: |
      The service automatically removes a backend target from its list of
      available targets when a health check detects that the target is
      unhealthy, so that traffic is no longer routed to that target.
  - id: CCC.LB.CP15
    group: Networking
    title: Session Affinity
    description: |
      The service may be configured to pass subsequent requests from an initial
      client to the same backend target.
  - id: CCC.LB.CP16
    group: Networking
    title: URL Redirects
    description: |
      The service can redirect incoming traffic to a different URL or location.
  - id: CCC.LB.CP17
    group: Networking
    title: URL Rewrites
    description: |
      The service can rewrite URL paths before forwarding requests to backend
      services.
  - id: CCC.LB.CP18
    group: Networking
    title: Custom Response
    description: |
      The service can return specific HTTP responses directly to the client under
      defined conditions, without forwarding the request to a backend target.
  - id: CCC.LB.CP19
    group: Networking
    title: Request and Response Header Transformations
    description: |
      The service can modify HTTP headers of both incoming requests and outgoing
      responses.
  - id: CCC.LB.CP20
    group: Networking
    title: Traffic Splitting / Weighted Routing
    description: |
      The service can distribute incoming traffic across multiple backend
      resources based on predefined weights or percentages, for example for
      canary, A/B, blue-green, or gradual traffic migration deployments.
  - id: CCC.LB.CP23
    group: Networking
    title: Firewall Integration
    description: |
      The service can integrate with a web application firewall so that only
      legitimate traffic reaches backend servers, blocking malicious requests.
  - id: CCC.LB.CP24
    group: Encryption
    title: Configurable TLS Policy
    description: |
      The service may be configured with a TLS policy that sets the minimum
      protocol version and the permitted cipher suites negotiated with clients.
  - id: CCC.LB.CP25
    group: Encryption
    title: Backend Re-encryption
    description: |
      The service can re-encrypt traffic to backend targets after terminating
      TLS at the load balancer, so that data stays encrypted end to end.
  - id: CCC.LB.CP26
    group: Access
    title: Mutual TLS Client Authentication
    description: |
      The service may be configured to require and validate client certificates
      during the TLS handshake, rejecting connections from clients that do not
      present a certificate issued by a trusted authority.
