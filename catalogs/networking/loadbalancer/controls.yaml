controls:
  - id: CCC.LB.CN05
    group: Networking
    title: Validate Session Affinity
    objective: |
      Configure session persistence to minimise fixation and hijacking
      risks.
    assessment-requirements:
      - id: CCC.LB.CN05.AR01
        text: |
          When stickiness is enabled, session cookies MUST expire
          within 30 minutes of inactivity.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: Audit CCC.LB.CP15 parameters via configuration scans.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH04
            strength: 0 # Not yet specified
            remarks: Session Persistence Is Exploited
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.AC-7
            strength: 0 # Not yet specified
            remarks: Least functionality is enforced
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-23
            strength: 0 # Not yet specified
            remarks: Session authenticity

  - id: CCC.LB.CN07
    group: Networking
    title: Scrub Sensitive Headers
    objective: |
      Remove headers that disclose internal details or software
      versions from HTTP responses.
    assessment-requirements:
      - id: CCC.LB.CN07.AR01
        text: |
          When responses pass through the load balancer, the
          "Server" header MUST be removed or replaced with a generic value
          that does not identify the software or its version.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: Configure header-transformation rules.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.Core.TH15
            strength: 0 # Not yet specified
            remarks: Automated Enumeration and Reconnaissance by Non-human Entities
          - reference-id: CCC.LB.TH06
            strength: 0 # Not yet specified
            remarks: Sensitive Metadata Exposure via HTTP Headers
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.DS-2
            strength: 0 # Not yet specified
            remarks: Data in transit is protected
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-13
            strength: 0 # Not yet specified
            remarks: Cryptographic protection

  - id: CCC.LB.CN10
    group: Networking
    title: Protect Health-Check Endpoints
    objective: |
      Ensure that health-check results cannot be influenced by entities other than the
      load balancer, so that healthy targets are not removed from service.
    assessment-requirements:
      - id: CCC.LB.CN10.AR01
        text: |
          When a backend target exposes a health-check endpoint, network access to
          that endpoint MUST be restricted to the load balancer's health-check
          source address ranges.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Allow the provider-published health-check source ranges in the target's
          security group or firewall rules and deny the health-check path to all
          other sources.
      - id: CCC.LB.CN10.AR02
        text: |
          When more than 10 percent of the targets behind a listener change from
          healthy to unhealthy within five minutes, the service MUST publish an
          alert to a monitored channel.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Create an alarm on the unhealthy-target-count metric relative to the
          registered target count.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH05
            strength: 0 # Not yet specified
            remarks: Health Checks Are Exploited to Take Services Offline

  - id: CCC.LB.CN11
    group: Networking
    title: Attach a Web Application Firewall to Internet-Facing Listeners
    objective: |
      Ensure that application-layer traffic from the internet is inspected and
      filtered before it reaches backend targets.
    assessment-requirements:
      - id: CCC.LB.CN11.AR01
        text: |
          When a listener is internet-facing and serves HTTP or HTTPS traffic, a web
          application firewall policy MUST be associated with it.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Associate the provider's web application firewall with every public
          layer-7 listener and include at least the managed core rule set.
      - id: CCC.LB.CN11.AR02
        text: |
          When a web application firewall policy is associated with a listener, the
          policy MUST run in blocking (prevention) mode rather than detection-only
          mode.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Review WAF policies for count, log-only or detection mode and switch
          them to block after tuning false positives.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH01
            strength: 0 # Not yet specified
            remarks: Unrestricted Request Traffic Overwhelms Downstream Services
          - reference-id: CCC.LB.TH12
            strength: 0 # Not yet specified
            remarks: Application-Layer Inspection Is Absent or Bypassed

  - id: CCC.LB.CN12
    group: Encryption
    title: Encrypt Traffic to Backend Targets
    objective: |
      Ensure that requests remain encrypted between the load balancer and its
      backend targets after TLS termination.
    assessment-requirements:
      - id: CCC.LB.CN12.AR01
        text: |
          When TLS is terminated at the load balancer, the backend protocol for
          every target group or backend pool MUST be HTTPS or TLS.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure HTTPS or TLS backend protocols and install certificates on the
          targets; use backend re-encryption rather than HTTP backends.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH09
            strength: 0 # Not yet specified
            remarks: Traffic to Backend Targets Is Forwarded Unencrypted

  - id: CCC.LB.CN13
    group: Access
    title: Validate Client Certificates
    objective: |
      Ensure that mutual TLS on a listener rejects clients that do not present a
      valid certificate from a trusted authority.
    assessment-requirements:
      - id: CCC.LB.CN13.AR01
        text: |
          When mutual TLS is enabled on a listener, the listener MUST operate in
          verify mode rather than passthrough mode.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Set the mTLS mode to verify with an explicit trust store containing only
          the approved client certificate authorities.
      - id: CCC.LB.CN13.AR02
        text: |
          When mutual TLS is enabled on a listener, the listener MUST check
          certificate revocation against a configured revocation list.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Upload and maintain certificate revocation lists in the trust store and
          enable revocation checking.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH10
            strength: 0 # Not yet specified
            remarks: Client Certificate Validation Is Bypassed

  - id: CCC.LB.CN14
    group: Access
    title: Prevent Forwarded-Header Spoofing
    objective: |
      Ensure that backend targets receive a trustworthy client source address.
    assessment-requirements:
      - id: CCC.LB.CN14.AR01
        text: |
          When the load balancer forwards a layer-7 request, client-supplied
          forwarded-for headers MUST be replaced with the connection source address
          rather than appended to.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Set the X-Forwarded-For handling mode to remove or replace client-supplied
          values; where only append is available, configure backends to trust only
          the last hop.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH13
            strength: 0 # Not yet specified
            remarks: Client Source Address Is Spoofed via Forwarded Headers

  - id: CCC.LB.CN15
    group: Access
    title: Apply Source Restrictions to Every Address Family
    objective: |
      Ensure that access restrictions on a dual-stack frontend apply to IPv6
      clients as well as IPv4 clients.
    assessment-requirements:
      - id: CCC.LB.CN15.AR01
        text: |
          When a listener accepts IPv6 traffic, each IPv4 source restriction applied
          to that listener MUST have a corresponding IPv6 source restriction.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Review security groups, firewall policies and WAF IP rules attached to
          dual-stack frontends; add IPv6 entries or disable the IPv6 frontend.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH14
            strength: 0 # Not yet specified
            remarks: IPv6 Frontend Bypasses IPv4-Only Access Rules

  - id: CCC.LB.CN16
    group: Networking
    title: Restrict Redirect Destinations
    objective: |
      Ensure that redirect rules cannot send users to hosts outside the
      organization's control.
    assessment-requirements:
      - id: CCC.LB.CN16.AR01
        text: |
          When a redirect rule is configured, the redirect target host MUST be a
          static value from an approved domain allowlist.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Audit listener rules for redirect actions whose host is a request
          variable or an unapproved domain.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH11
            strength: 0 # Not yet specified
            remarks: Routing Rules Direct Requests to Unintended Destinations

  - id: CCC.LB.CN17
    group: Encryption
    title: Enforce Minimum TLS Policy
    objective: |
      Ensure that listeners negotiate only current TLS protocol versions and
      approved cipher suites with clients.
    assessment-requirements:
      - id: CCC.LB.CN17.AR01
        text: |
          When a TLS or HTTPS listener is configured, its TLS policy MUST set the
          minimum protocol version to TLS 1.2 or higher.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Select a provider-predefined TLS policy whose minimum version is TLS 1.2
          or TLS 1.3 and remove listeners that use legacy policies.
      - id: CCC.LB.CN17.AR02
        text: |
          When a TLS or HTTPS listener is configured, its TLS policy MUST permit
          only cipher suites on the organization's approved list.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use a predefined policy limited to AEAD cipher suites with forward secrecy,
          or define a custom policy from the approved list.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH02
            strength: 0 # Not yet specified
            remarks: Data is Intercepted in Transit
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH08
            strength: 0 # Not yet specified
            remarks: Weak TLS Policy Permits Protocol Downgrade

  - id: CCC.LB.CN18
    group: Encryption
    title: Automate Listener Certificate Renewal
    objective: |
      Ensure that certificates attached to listeners are renewed before expiry
      without manual intervention.
    assessment-requirements:
      - id: CCC.LB.CN18.AR01
        text: |
          When a certificate is attached to a TLS or HTTPS listener, it MUST be
          issued by a certificate manager with automatic renewal enabled.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use the provider's managed certificate service or a certificate-manager
          integration that renews and redeploys certificates automatically; avoid
          uploading certificate files directly to the listener.
      - id: CCC.LB.CN18.AR02
        text: |
          When a certificate attached to a listener is within 30 days of expiry,
          the service MUST publish an alert to a monitored channel.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Create an alarm on the certificate days-to-expiry metric or on the
          certificate manager's expiry events.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH07
            strength: 0 # Not yet specified
            remarks: TLS Certificates Are Expired or Invalid

  - id: CCC.LB.CN19
    group: Observability
    title: Alert on Traffic Distribution Changes
    objective: |
      Ensure that changes to how traffic is distributed across targets are
      published so that they cannot occur unobserved.
    assessment-requirements:
      - id: CCC.LB.CN19.AR01
        text: |
          When the distribution algorithm or the routing weights of a listener rule
          are changed, the service MUST publish an event to a monitored channel
          which includes the client identity, time, and new distribution settings.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Route the provider's configuration-change events for load balancer rules
          and target weights to an alerting rule or ticketing integration.
    threats:
      - reference-id: LB
        entries:
          - reference-id: CCC.LB.TH03
            strength: 0 # Not yet specified
            remarks: Traffic Distribution Is Manipulated
