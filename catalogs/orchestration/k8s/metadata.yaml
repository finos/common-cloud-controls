metadata:
  id: CCC.K8S
  title: CCC Managed Kubernetes Container Orchestration
  description: |
    Managed Kubernetes services provide a cloud-hosted Kubernetes control plane and
    integrated compute, networking, storage, identity, and observability capabilities
    for orchestrating containerized workloads. The cloud service provider operates the
    managed service components, while users remain responsible for configuring cluster
    access, workloads, policies, data protection, and service integrations.
  category-ids:
    - CCC.Orchestration
  version: ""
  last-modified: "2026-07-13T00:00:00Z"
