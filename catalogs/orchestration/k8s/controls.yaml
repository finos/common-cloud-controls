controls:
  - id: CCC.K8S.CN01
    group: Access
    title: Restrict Kubernetes API Network Access
    objective: |
      Ensure that Kubernetes API reachability is limited to explicitly approved networks
      and private management paths to reduce administrative exposure.
    assessment-requirements:
      - id: CCC.K8S.CN01.AR01
        text: |
          When a Kubernetes API endpoint is active, its network access configuration
          MUST restrict inbound traffic to explicitly approved private networks or
          source address ranges.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure a private cluster endpoint where possible and otherwise maintain a
          minimal allowlist of approved administration networks.
      - id: CCC.K8S.CN01.AR02
        text: |
          When a Kubernetes API endpoint is active, public network access to that endpoint
          MUST be disabled.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Use private endpoint connectivity, private DNS, and controlled administrative
          access paths from trusted networks. Note that an IAM-gated, DNS-based control-plane
          endpoint remains reachable from the internet and does not by itself satisfy this
          requirement.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            strength: 8 # Network restriction reduces unauthorized access paths.
            remarks: Access is Granted to Unauthorized Users
          - reference-id: CCC.Core.TH15
            strength: 9 # Private API access substantially limits remote enumeration.
            remarks: Automated Enumeration and Reconnaissance by Non-human Entities
          - reference-id: CCC.Core.TH17
            strength: 8 # Untrusted request sources are prevented from reaching the API.
            remarks: Responses are Generated for Unauthorized Requests
          - reference-id: CCC.K8S.TH01
            strength: 10
            remarks: Kubernetes API is Exposed to Untrusted Networks
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-7
            remarks: Boundary Protection
          - reference-id: AC-17
            remarks: Remote Access
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.02
            remarks: Least functionality
          - reference-id: PR.IR-01.01
            remarks: Network segmentation

  - id: CCC.K8S.CN02
    group: Access
    title: Enforce Least-Privilege Cluster Authorization
    objective: |
      Ensure that cloud and Kubernetes authorization grant identities only the permissions
      required for their cluster responsibilities and cannot be used to escalate privilege.
    assessment-requirements:
      - id: CCC.K8S.CN02.AR01
        text: |
          When a user or group is granted cluster access, each cloud access binding and
          Kubernetes role binding MUST grant only an approved role required by that
          identity's documented responsibilities.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Assign access to managed identity groups and review cloud access entries,
          ClusterRoleBindings, and RoleBindings against an approved entitlement inventory.
      - id: CCC.K8S.CN02.AR02
        text: |
          When a non-system Kubernetes role is defined, it MUST NOT grant wildcard verbs,
          wildcard resources, or wildcard API groups.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Replace broad roles with namespace-scoped roles that enumerate API groups,
          resources, and verbs. Use resource names where the verb supports them, such as
          get, update, patch, and delete.
      - id: CCC.K8S.CN02.AR03
        text: |
          When a non-system RoleBinding or ClusterRoleBinding is created or updated, its
          subjects MUST NOT include the system:anonymous, system:unauthenticated, or
          system:authenticated groups.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce the restriction with admission policy and review existing non-system
          bindings for these groups. On services where system:authenticated includes any account of the
          identity provider, treat such a binding as public access.
      - id: CCC.K8S.CN02.AR04
        text: |
          When a non-system Kubernetes role grants the escalate, bind, or impersonate verbs,
          grants update on certificatesigningrequests/approval together with approve on
          signers, or grants create, update, patch, or delete on admission webhook
          configurations or admission policies, that role MUST be bound only to a dedicated
          administrative group.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Treat escalate, bind, impersonate, certificate signing request approval, and write
          access to ValidatingWebhookConfigurations, MutatingWebhookConfigurations,
          ValidatingAdmissionPolicies, and their bindings as privileged permissions, and
          alert on new bindings that grant them. Approval lets an identity obtain a client
          certificate for any user or group, and admission configuration write access lets
          an identity weaken or bypass admission control under CCC.K8S.CN11.
      - id: CCC.K8S.CN02.AR05
        text: |
          When a workload is not approved for Kubernetes API access, its service account
          token MUST NOT be mounted into the workload.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Set automountServiceAccountToken to false on service accounts and pod
          specifications by default and enable it only for workloads that require API access.
      - id: CCC.K8S.CN02.AR06
        text: |
          When a non-system Kubernetes role grants create on pods or workload controllers in
          a system or privileged namespace, get or create on pods/exec, pods/attach,
          pods/portforward, pods/proxy, services/proxy, or nodes/proxy, create on
          serviceaccounts/token, or update or patch on pods/ephemeralcontainers, in any
          namespace, that role MUST be bound only to a dedicated administrative group.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Keep workload creation in system and privileged namespaces with the platform
          administration group, and alert on new bindings that grant these permissions.
          Exec, attach, port-forward, and proxy connections made over WebSocket are
          authorized as get requests, so get on these subresources is as privileged as
          create. Workloads in user namespaces are governed under CCC.K8S.CN05.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            strength: 10
            remarks: Access is Granted to Unauthorized Users
          - reference-id: CCC.K8S.TH02
            strength: 9 # Cluster authorization is one layer of the cloud access chain.
            remarks: Workload Identity Grants Excessive Cloud Access
          - reference-id: CCC.K8S.TH13
            strength: 8 # Least privilege constrains controller reconciliation scope.
            remarks: Controllers Reconcile Unauthorized Cluster State
          - reference-id: CCC.K8S.TH19
            strength: 10
            remarks: Kubernetes Authorization Permits Privilege Escalation
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
            remarks: Access Enforcement
          - reference-id: AC-6
            remarks: Least Privilege
      - reference-id: CRI
        entries:
          - reference-id: PR.AA-05.01
            remarks: Access privilege limitation
          - reference-id: PR.AA-05.03
            remarks: Service accounts

  - id: CCC.K8S.CN03
    group: Access
    title: Use Federated Identities for Workloads
    objective: |
      Ensure that workloads access cloud services through narrowly scoped, short-lived
      federated identity rather than stored cloud credentials.
    assessment-requirements:
      - id: CCC.K8S.CN03.AR01
        text: |
          When a workload accesses a cloud API, its Kubernetes service account MUST be
          bound to a dedicated cloud identity that issues short-lived credentials through
          workload identity federation.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use the CSP workload identity integration and assign one cloud permission set
          for each distinct workload responsibility.
      - id: CCC.K8S.CN03.AR02
        text: |
          When a workload specification or Kubernetes configuration object is created or
          updated, it MUST NOT contain long-lived cloud access keys, client secrets, or
          service-account key files.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Scan workload manifests, Secrets, ConfigMaps, environment variables, and mounted
          files for static cloud credentials and revoke any discovered credentials.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH02
            strength: 10
            remarks: Workload Identity Grants Excessive Cloud Access
          - reference-id: CCC.K8S.TH03
            strength: 10
            remarks: Long-Lived Credentials are Exposed to Workloads
          - reference-id: CCC.K8S.TH07
            strength: 7 # Federation removes cloud keys but not all workload secrets.
            remarks: Secrets are Exposed to Unauthorized Workloads or Users
          - reference-id: CCC.K8S.TH20
            strength: 5 # Federated identity removes the need for node metadata credentials.
            remarks: Workloads Obtain Node Credentials from Instance Metadata
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-6
            remarks: Least Privilege
          - reference-id: IA-5
            remarks: Authenticator Management
      - reference-id: CRI
        entries:
          - reference-id: PR.AA-04.01
            remarks: Access control within and across security perimeters
          - reference-id: PR.AA-05.01
            remarks: Access privilege limitation

  - id: CCC.K8S.CN04
    group: Resource
    title: Admit Only Trusted Container Images
    objective: |
      Ensure that unapproved, mutable, unverifiable, or critically vulnerable container
      images cannot enter the workload environment.
    assessment-requirements:
      - id: CCC.K8S.CN04.AR01
        text: |
          When a workload is admitted, every container image MUST originate from an
          approved registry AND be referenced by an immutable digest.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce registry allowlists and digest pinning with an admission policy.
      - id: CCC.K8S.CN04.AR02
        text: |
          When a container image is admitted, its signature and provenance attestation
          MUST be verified against an approved publisher and build process.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Sign images during the approved build pipeline and enforce signature and
          provenance verification during admission.
      - id: CCC.K8S.CN04.AR03
        text: |
          When a container image contains a known critical vulnerability, admission of
          that image MUST be denied.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Integrate continuously updated registry vulnerability results with the cluster's
          admission policy and remediate affected images before deployment.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH04
            strength: 10
            remarks: Untrusted Container Images are Deployed
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: RA-5
            remarks: Vulnerability Monitoring and Scanning
          - reference-id: SI-7
            remarks: Software, Firmware, and Information Integrity
          - reference-id: SR-11
            remarks: Component Authenticity
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.01
            remarks: Configuration baselines
          - reference-id: DE.CM-09.03
            remarks: Unauthorized software, hardware, or configuration changes
          - reference-id: DE.CM-09.01
            remarks: Software and data integrity checking

  - id: CCC.K8S.CN05
    group: Compute
    title: Enforce Restricted Workload Security
    objective: |
      Ensure that workload privilege is minimized and that unnecessary access to host-level
      resources that could defeat container isolation is blocked.
    assessment-requirements:
      - id: CCC.K8S.CN05.AR01
        text: |
          When a workload is admitted to a user workload namespace, it MUST satisfy the
          Kubernetes Baseline Pod Security Standard AND its Linux containers MUST NOT allow
          privilege escalation.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce the Baseline standard through Pod Security Admission namespace labels or an
          equivalent admission policy. The Baseline standard blocks privileged execution,
          host namespaces, host paths, host ports, and capabilities beyond the default set,
          but not privilege escalation, so set allowPrivilegeEscalation to false as well. A
          user workload namespace is any namespace other than kube-system, kube-public,
          kube-node-lease, and the namespaces reserved for CSP-managed add-ons; those system
          namespaces are governed separately under CCC.K8S.CN11.
      - id: CCC.K8S.CN05.AR02
        text: |
          When a Linux workload is admitted to a user workload namespace, it MUST satisfy the
          Kubernetes Restricted Pod Security Standard.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Define secure defaults in workload templates and enforce the Restricted standard
          through admission policy before resources are persisted. The Restricted standard
          requires a non-root user, a RuntimeDefault or Localhost seccomp profile, disabled
          privilege escalation, and dropping all capabilities except NET_BIND_SERVICE.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH05
            strength: 10
            remarks: Privileged Workloads Escape Isolation
          - reference-id: CCC.K8S.TH12
            strength: 4 # Policy is enforced by admission, so it adds little when admission is bypassed.
            remarks: Admission Controls are Bypassed
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-6
            remarks: Least Privilege
          - reference-id: CM-7
            remarks: Least Functionality
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.02
            remarks: Least functionality
          - reference-id: PR.AA-05.01
            remarks: Access privilege limitation

  - id: CCC.K8S.CN06
    group: Networking
    title: Enforce Default-Deny Workload Network Policies
    objective: |
      Ensure that workload communication is confined to flows permitted by explicit,
      least-privilege network policies, with all other traffic denied by default.
    assessment-requirements:
      - id: CCC.K8S.CN06.AR01
        text: |
          When a user workload namespace is created, an enforced network policy MUST deny
          all ingress and egress traffic by default.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable a network-policy-capable data plane and deploy default-deny ingress and
          egress policies through the namespace provisioning process. Allow egress to the
          cluster DNS service explicitly. Network policies do not apply to host-network pods,
          which CCC.K8S.CN05 prevents in user workload namespaces.
      - id: CCC.K8S.CN06.AR02
        text: |
          When communication is required, each allow policy MUST identify the approved
          source, destination, protocol, and port using stable namespace, workload, or
          network selectors.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Generate explicit application flow policies and test both expected connections
          and denied lateral or external connections.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH06
            strength: 10
            remarks: Workload Network Segmentation is Not Enforced
          - reference-id: CCC.K8S.TH10
            strength: 7 # Default-deny networking limits access but not endpoint creation.
            remarks: Workload Endpoints are Exposed Unintentionally
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-4
            remarks: Information Flow Enforcement
          - reference-id: SC-7
            remarks: Boundary Protection
      - reference-id: CRI
        entries:
          - reference-id: PR.IR-01.01
            remarks: Network segmentation
          - reference-id: PR.IR-01.02
            remarks: Network device configurations

  - id: CCC.K8S.CN07
    group: Access
    title: Protect Workload Secrets
    objective: |
      Ensure that workload secrets are encrypted, readable only by their intended
      identities, and kept out of images and non-secret configuration objects.
    assessment-requirements:
      - id: CCC.K8S.CN07.AR01
        text: |
          When a secret is mounted or injected into a workload, it MUST NOT be readable by
          the service accounts of other workloads in the namespace.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use a protected Kubernetes secret mechanism or an external secrets service, and
          verify that other service accounts in the namespace cannot read the secret.
      - id: CCC.K8S.CN07.AR02
        text: |
          When Kubernetes secret access is granted, workload roles MUST be limited to the
          required named secrets and MUST NOT grant unrestricted list or watch access.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use namespace-scoped roles with resource names and audit service accounts that
          can read Secret resources. Permission to create pods in a namespace also allows
          mounting any secret in that namespace.
      - id: CCC.K8S.CN07.AR03
        text: |
          When a Kubernetes Secret is persisted to the cluster datastore, it MUST be
          envelope-encrypted with a key held in a cloud key management service.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable the service's KMS envelope encryption for Kubernetes Secrets. Use a
          customer-managed key where CCC.Core.CN11 requires one.
      - id: CCC.K8S.CN07.AR04
        text: |
          When a workload is deployed, secret values MUST NOT be present in its container
          images, ConfigMaps, or plain environment variables in the workload specification.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Scan images and manifests for secret material before deployment and rotate any
          secret discovered in a static workload artifact.
      - id: CCC.K8S.CN07.AR05
        text: |
          When a cluster is operational, long-lived service-account-token Secrets MUST NOT
          exist outside an approved exception list.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use projected, time-bound service account tokens and remove Secrets of type
          kubernetes.io/service-account-token that are not explicitly approved.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH03
            strength: 8 # Externalization reduces stored credentials but rotation also matters.
            remarks: Long-Lived Credentials are Exposed to Workloads
          - reference-id: CCC.K8S.TH07
            strength: 10
            remarks: Secrets are Exposed to Unauthorized Workloads or Users
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
            remarks: Access Enforcement
          - reference-id: IA-5
            remarks: Authenticator Management
          - reference-id: SC-28
            remarks: Protection of Information at Rest
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.06
            remarks: Encryption management practices

  - id: CCC.K8S.CN08
    group: Orchestration
    title: Govern Cluster Add-ons and Extensions
    objective: |
      Ensure that enabled CSP-provided add-ons are limited to an organization-controlled
      allowlist and that third-party extensions run with constrained permissions.
    assessment-requirements:
      - id: CCC.K8S.CN08.AR01
        text: |
          When a CSP-provided cluster add-on, extension, or managed feature is enabled, it MUST
          be included in an organization-controlled allowlist.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Assign a cluster platform owner to maintain the allowlist through change control and
          continuously reconcile installed components against it.
      - id: CCC.K8S.CN08.AR02
        text: |
          When a third-party operator, controller, or admission webhook is installed, its
          Kubernetes permissions MUST be limited to the namespaces and resources it manages.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Review the roles shipped with each chart or operator before installation, replace
          cluster-wide grants with namespace-scoped roles where possible, and admit its images
          under CCC.K8S.CN04.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH08
            strength: 10
            remarks: Cluster Extensions Execute Untrusted Code
          - reference-id: CCC.K8S.TH13
            strength: 7 # Scoped extension permissions bound what a controller can reconcile.
            remarks: Controllers Reconcile Unauthorized Cluster State
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-7
            remarks: Software, Firmware, and Information Integrity
          - reference-id: SR-3
            remarks: Supply Chain Controls and Processes
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.01
            remarks: Configuration baselines
          - reference-id: PR.PS-01.02
            remarks: Least functionality

  - id: CCC.K8S.CN09
    group: Resource
    title: Maintain Supported Cluster Components
    objective: |
      Ensure that control-plane, worker, runtime, and extension components remain within
      supported and vulnerability-managed release lifecycles.
    assessment-requirements:
      - id: CCC.K8S.CN09.AR01
        text: |
          When a cluster is operational, its Kubernetes control-plane version, worker
          version, and node image MUST remain within the CSP's current support lifecycle.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Monitor provider support calendars and inventory all control-plane and worker
          versions before support deadlines. The container runtime is supported as part of
          the node image. Treat an extended support period as within lifecycle only while the
          cluster is enrolled in it.
      - id: CCC.K8S.CN09.AR02
        text: |
          When the CSP publishes a security update for a cluster component or worker-node
          image, the update MUST be applied within 30 days of publication.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use automatic upgrade channels and maintenance windows where available, and test
          upgrades in a representative non-production cluster before promotion.
      - id: CCC.K8S.CN09.AR03
        text: |
          When a cluster add-on or extension is installed, its version MUST be compatible with
          the active Kubernetes version and remain supported by its publisher.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Include managed add-ons, CSI and CNI components, ingress controllers, policy
          engines, and observability agents in the version inventory.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH09
            strength: 10
            remarks: Unsupported Cluster Components Remain in Use
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: CM-8
            remarks: System Component Inventory
          - reference-id: SI-2
            remarks: Flaw Remediation
      - reference-id: CRI
        entries:
          - reference-id: ID.RA-07.01
            remarks: Change management standards and procedures
          - reference-id: PR.PS-06.06
            remarks: Vulnerability remediation
          - reference-id: PR.PS-06.07
            remarks: Development and operational process alignment

  - id: CCC.K8S.CN10
    group: Data
    title: Restrict Persistent Volume Access
    objective: |
      Ensure that persistent storage provisioning and mounts stay within their approved
      namespace, storage class, and ownership boundary.
    assessment-requirements:
      - id: CCC.K8S.CN10.AR01
        text: |
          When a persistent volume claim is created, its storage class MUST be approved for
          the claim's namespace.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Restrict storage classes per namespace through admission policy or per-storage-class
          ResourceQuota limits, and use dedicated service accounts for stateful workloads.
      - id: CCC.K8S.CN10.AR02
        text: |
          When a persistent volume is statically created, it MUST be pre-bound through its
          claim reference to the intended namespace and claim.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Prefer dynamic provisioning and require sanitization or cryptographic erasure
          before reusing storage across ownership boundaries.
      - id: CCC.K8S.CN10.AR03
        text: |
          When a persistent volume is backed by a shared file system, its file share, path,
          or access point MUST NOT be referenced by a persistent volume bound to a claim in
          another namespace.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Provision a separate file share, directory, or access point for each namespace,
          such as a per-claim access point from the file storage CSI driver, and compare the
          volume handles of shared file system volumes across namespaces.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH11
            strength: 10
            remarks: Persistent Volumes are Bound to Unauthorized Workloads
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
            remarks: Access Enforcement
          - reference-id: AC-4
            remarks: Information Flow Enforcement
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.01
            remarks: Configuration baselines

  - id: CCC.K8S.CN11
    group: Orchestration
    title: Protect Admission Control Enforcement
    objective: |
      Ensure that mandatory cluster security policy applies to every workload path and that
      its scope or enforcement configuration cannot be bypassed or modified without
      authorization.
    assessment-requirements:
      - id: CCC.K8S.CN11.AR01
        text: |
          When security admission policies are enabled, every namespace and relevant create
          or update operation MUST be governed by an explicitly defined policy, including
          separate policies for system namespaces that require different constraints.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Test policy coverage across user and system namespaces, workload controllers,
          direct pod creation, and ephemeral container updates.
      - id: CCC.K8S.CN11.AR02
        text: |
          When admission policy configuration is modified, the change MUST require a
          dedicated administrative role.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Separate policy administration from workload administration and alert on policy,
          webhook, namespace-label, and policy-scope changes.
      - id: CCC.K8S.CN11.AR03
        text: |
          When an external admission component enforces a mandatory control, unavailable or
          untrusted webhook responses MUST cause the request to be denied.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure mandatory validation webhooks to fail closed and monitor webhook
          availability and certificate trust continuously.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH12
            strength: 10
            remarks: Admission Controls are Bypassed
          - reference-id: CCC.K8S.TH13
            strength: 8 # Admission limits unauthorized state before reconciliation.
            remarks: Controllers Reconcile Unauthorized Cluster State
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: CM-3
            remarks: Configuration Change Control
          - reference-id: CM-6
            remarks: Configuration Settings
          - reference-id: SI-7
            remarks: Software, Firmware, and Information Integrity
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-01.01
            remarks: Configuration baselines
          - reference-id: DE.CM-09.03
            remarks: Unauthorized software, hardware, or configuration changes

  - id: CCC.K8S.CN12
    group: Access
    title: Restrict Node Administrative Access
    objective: |
      Ensure that untrusted or unauthenticated paths to worker-node administration, kubelet
      interfaces, and instance metadata are blocked.
    assessment-requirements:
      - id: CCC.K8S.CN12.AR01
        text: |
          When a worker node is active, kubelet and node administrative APIs MUST reject
          anonymous and unauthenticated requests, including through read-only ports.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use provider-managed node authorization, disable the kubelet read-only port, and
          verify kubelet configuration and network reachability from outside approved
          management paths.
      - id: CCC.K8S.CN12.AR02
        text: |
          When SSH, RDP, or another node management interface is enabled, it MUST NOT be
          reachable from the public internet and MUST be restricted to an approved
          authenticated management path.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Disable interactive node access where possible and otherwise use an audited
          session-management or bastion service without public node addresses.
      - id: CCC.K8S.CN12.AR03
        text: |
          When a workload runs on a worker node, it MUST NOT be able to obtain credentials
          issued to the node's cloud identity from the instance metadata service.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use workload identity federation, metadata concealment or hop limits, and network
          policy or node firewall controls. Where the service's metadata server intercepts
          workload requests to issue federated workload credentials, verify that it does not
          return the node's own credentials.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH19
            strength: 4 # Closing unauthenticated kubelet ports limits node metrics exposure.
            remarks: Metrics are Read by Unauthorized Entities
          - reference-id: CCC.K8S.TH14
            strength: 10
            remarks: Node Administrative Interfaces Expose Cluster Credentials
          - reference-id: CCC.K8S.TH20
            strength: 10
            remarks: Workloads Obtain Node Credentials from Instance Metadata
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-17
            remarks: Remote Access
          - reference-id: CM-7
            remarks: Least Functionality
          - reference-id: IA-2
            remarks: Identification and Authentication (Organizational Users)
      - reference-id: CRI
        entries:
          - reference-id: DE.CM-01.03
            remarks: Unauthorized network connections and data transfers
          - reference-id: DE.CM-06.01
            remarks: Third-party connection authorization
          - reference-id: DE.CM-06.02
            remarks: Third-party access monitoring

  - id: CCC.K8S.CN13
    group: Resource
    title: Bound Workload Resource Consumption
    objective: |
      Ensure that resource requests, namespace consumption, and autoscaling are bounded so
      workloads cannot exhaust cluster or cloud capacity.
    assessment-requirements:
      - id: CCC.K8S.CN13.AR01
        text: |
          When a workload is admitted, every container MUST define approved CPU and memory
          requests and an approved memory limit.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Apply LimitRanges for defaults and validate workload-specific requests and limits
          against tested capacity requirements. Set CPU limits where throttling is acceptable.
      - id: CCC.K8S.CN13.AR02
        text: |
          When a user workload namespace is active, ResourceQuota objects MUST bound its
          aggregate CPU, memory, storage, workload count, and externally exposed services.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Provision namespace quotas from centrally governed templates and alert before
          consumption reaches each quota.
      - id: CCC.K8S.CN13.AR03
        text: |
          When workload or node autoscaling is enabled, every autoscaler MUST define an
          approved maximum replica or capacity boundary.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Set workload replica maxima, node-pool maxima, node provisioner limits, cloud
          quotas, budgets, and alerts that constrain the complete scaling chain.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH12
            strength: 10
            remarks: Resource Constraints are Exhausted
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-5
            remarks: Denial-of-service Protection
      - reference-id: CRI
        entries:
          - reference-id: PR.IR-04.01
            remarks: Utilization monitoring
          - reference-id: DE.CM-01.02
            remarks: Network traffic volume monitoring

  - id: CCC.K8S.CN14
    group: Observability
    title: Preserve Kubernetes Audit and Monitoring Records
    objective: |
      Ensure that security-relevant Kubernetes activity and health signals are completely
      recorded, externally retained, access-controlled, and monitored.
    assessment-requirements:
      - id: CCC.K8S.CN14.AR01
        text: |
          When a cluster is operational, Kubernetes API audit logs, control-plane logs, and
          security-relevant node, workload, and network activity records MUST be enabled and
          exported to an approved external logging destination.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable each CSP control-plane logging category, such as the api, audit, and
          authenticator log types, the kube-audit and kube-audit-admin categories, or the
          Kubernetes Data Access audit logs, and export cluster telemetry to a centrally
          governed logging account or project.
      - id: CCC.K8S.CN14.AR02
        text: |
          When Kubernetes audit or monitoring records are retained, write, delete, and
          configuration access MUST be separated from cluster workload and routine cluster
          administration identities.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use a separate security logging boundary with retention protection and narrowly
          scoped read access for monitoring and investigation roles.
      - id: CCC.K8S.CN14.AR03
        text: |
          When a cluster-admin binding, an admission webhook or policy object, or the audit
          log category configuration changes, the monitoring system MUST generate an alert
          for review by an authorized security function.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Create detections for these security-sensitive Kubernetes audit events and test
          alert delivery regularly. CSP-level protective configuration changes are covered by
          CCC.Core.CN16.
      - id: CCC.K8S.CN14.AR04
        text: |
          When cluster or workload metrics are exposed or exported, read access MUST be
          restricted to authorized monitoring identities.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Require authentication on in-cluster metrics endpoints, restrict RBAC access to
          metrics APIs, and scope read access in the cloud monitoring service.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH07
            strength: 10
            remarks: Logs are Tampered With or Deleted
          - reference-id: CCC.Core.TH09
            strength: 9 # Access separation substantially limits unauthorized log reads.
            remarks: Runtime Logs are Read by Unauthorized Entities
          - reference-id: CCC.Core.TH10
            strength: 8 # Central access control protects state-change records.
            remarks: State-change Events are Read by Unauthorized Entities
          - reference-id: CCC.Core.TH11
            strength: 4 # Review can surface incorrectly triggered publications but not prevent them.
            remarks: Publications are Incorrectly Triggered
          - reference-id: CCC.Core.TH16
            strength: 10
            remarks: Publications are Disabled
          - reference-id: CCC.Core.TH19
            strength: 10
            remarks: Metrics are Read by Unauthorized Entities
          - reference-id: CCC.K8S.TH15
            strength: 10
            remarks: Kubernetes Audit Records are Incomplete or Unavailable
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AU-2
            remarks: Event Logging
          - reference-id: AU-6
            remarks: Audit Record Review, Analysis, and Reporting
          - reference-id: AU-9
            remarks: Protection of Audit Information
          - reference-id: AU-12
            remarks: Audit Record Generation
      - reference-id: CRI
        entries:
          - reference-id: PR.PS-04.01
            remarks: Log management standards
          - reference-id: PR.IR-04.01
            remarks: Utilization monitoring

  - id: CCC.K8S.CN15
    group: Resource
    title: Protect Resource Metadata
    objective: |
      Ensure that policy-relevant cloud tags and Kubernetes labels remain complete and
      accurate by limiting their modification to authorized identities.
    assessment-requirements:
      - id: CCC.K8S.CN15.AR01
        text: |
          When a cluster, node pool, namespace, or governed workload is created, all
          organization-required ownership, environment, data-classification, and policy
          metadata MUST be present with approved values.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce required cloud tags and Kubernetes labels during resource creation and
          continuously report missing or invalid values.
      - id: CCC.K8S.CN15.AR02
        text: |
          When metadata controls authorization, network policy, admission, billing, or data
          handling, modification of that metadata MUST be restricted to a dedicated role.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Protect policy-significant labels and tags with cloud policy, Kubernetes RBAC,
          admission policy, and alerts for unauthorized changes.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH13
            strength: 10
            remarks: Resource Tags are Manipulated
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-16
            remarks: Security and Privacy Attributes
          - reference-id: CM-3
            remarks: Configuration Change Control
          - reference-id: CM-8
            remarks: System Component Inventory
      - reference-id: CRI
        entries:
          - reference-id: PR.AA-05.01
            remarks: Access privilege limitation

  - id: CCC.K8S.CN16
    group: Access
    title: Enforce Managed Cluster Authentication
    objective: |
      Ensure that human access to the Kubernetes API and cluster resources is bound to
      identities that can be centrally governed, monitored, and revoked.
    assessment-requirements:
      - id: CCC.K8S.CN16.AR01
        text: |
          When a human accesses the Kubernetes API or cluster resources, authentication MUST
          use an identity from a centrally managed identity provider or cloud identity service
          whose revocation removes that access independently of the cluster.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Integrate cluster authentication with a managed identity provider or cloud identity
          service and govern human access through centrally maintained identity lifecycle
          processes.
      - id: CCC.K8S.CN16.AR02
        text: |
          When a human user authenticates to the Kubernetes API or cluster resources, the
          authentication MUST NOT use an unmanaged local account, a static credential, or a
          legacy authentication method.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Disable local cluster accounts, client certificate issuance for users, and legacy
          configuration-map identity mappings in favor of the service's managed access entries,
          and monitor the cluster for their reintroduction. This requirement applies to human
          users only; certificate-based authentication between components is governed by
          CCC.Core.CN01.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            strength: 9 # Managed authentication constrains unauthorized identity use.
            remarks: Access is Granted to Unauthorized Users
          - reference-id: CCC.K8S.TH16
            strength: 10
            remarks: Unmanaged Credentials Bypass Cluster Identity Controls
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-2
            remarks: Account Management
          - reference-id: IA-2
            remarks: Identification and Authentication (Organizational Users)
          - reference-id: IA-5
            remarks: Authenticator Management
      - reference-id: CRI
        entries:
          - reference-id: PR.AA-01.01
            remarks: Identity and credential management
          - reference-id: PR.AA-02.01
            remarks: Authentication of identity
          - reference-id: DE.CM-03.01
            remarks: Access activity logging and monitoring

  - id: CCC.K8S.CN17
    group: Access
    title: Restrict Cluster Infrastructure Identities
    objective: |
      Ensure that cloud access by cluster infrastructure is limited to the permissions and
      resources required for each platform responsibility.
    assessment-requirements:
      - id: CCC.K8S.CN17.AR01
        text: |
          When cluster infrastructure identities are assigned, control-plane, worker-node, and
          supporting components with distinct security responsibilities MUST use independently
          governed cloud identities.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Separate infrastructure identities according to component responsibility and
          review their trust relationships and assignments together.
      - id: CCC.K8S.CN17.AR02
        text: |
          When a cluster infrastructure identity is granted cloud permissions, it MUST receive
          only the cloud actions and resource scope required for its platform responsibility.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Replace shared, default, or general-purpose permissions with narrowly scoped
          identity assignments and continuously review their effective access. Avoid default
          compute identities with broad project roles for nodes, and move networking add-on
          permissions from the node identity to a workload identity.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH02
            strength: 6 # Identity separation reinforces least privilege across cloud access.
            remarks: Workload Identity Grants Excessive Cloud Access
          - reference-id: CCC.K8S.TH17
            strength: 10
            remarks: Cluster Infrastructure Identities Grant Excessive Cloud Access
          - reference-id: CCC.K8S.TH20
            strength: 5 # A narrowly scoped node identity limits the value of metadata credentials.
            remarks: Workloads Obtain Node Credentials from Instance Metadata
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-2
            remarks: Account Management
          - reference-id: AC-6
            remarks: Least Privilege
      - reference-id: CRI
        entries:
          - reference-id: PR.AA-05.01
            remarks: Access privilege limitation

  - id: CCC.K8S.CN18
    group: Compute
    title: Protect Worker Node Integrity
    objective: |
      Ensure that untrusted or altered worker-node software cannot operate beneath
      Kubernetes workloads.
    assessment-requirements:
      - id: CCC.K8S.CN18.AR01
        text: |
          When a worker node is created, it MUST use a supported image obtained from the
          service or an authenticated publisher.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Provision worker pools from maintained image sources and verify image identity and
          support status during creation and replacement.
      - id: CCC.K8S.CN18.AR02
        text: |
          When a worker node starts, it MUST complete service-supported boot-integrity
          verification before accepting workloads.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable the service's node boot-integrity protections, such as secure boot and a
          virtual TPM, and monitor their reported state throughout the worker-node lifecycle.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH05
            strength: 7 # Node integrity limits persistence beneath workload isolation.
            remarks: Privileged Workloads Escape Isolation
          - reference-id: CCC.K8S.TH09
            strength: 8 # Trusted supported images reduce vulnerable node components.
            remarks: Unsupported Cluster Components Remain in Use
          - reference-id: CCC.K8S.TH18
            strength: 10
            remarks: Worker Node Integrity is Not Verified
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: CM-2
            remarks: Baseline Configuration
          - reference-id: SI-2
            remarks: Flaw Remediation
          - reference-id: SI-7
            remarks: Software, Firmware, and Information Integrity
      - reference-id: CRI
        entries:
          - reference-id: DE.CM-09.01
            remarks: Software and data integrity checking
          - reference-id: DE.CM-09.03
            remarks: Unauthorized software, hardware, or configuration changes

  - id: CCC.K8S.CN19
    group: Networking
    title: Restrict External Exposure of Workload Services
    objective: |
      Ensure that workload services are reachable from outside the cluster network only
      through explicitly approved, source-restricted entry points.
    assessment-requirements:
      - id: CCC.K8S.CN19.AR01
        text: |
          When a LoadBalancer Service, Ingress, or Gateway is created, its load balancer MUST
          be provisioned with internal scope unless its namespace is approved for external
          exposure.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce internal load balancer annotations or classes through admission policy,
          such as an internal scheme on AWS, an internal load balancer on Azure, or an
          internal load balancer type on GCP.
      - id: CCC.K8S.CN19.AR02
        text: |
          When an externally scoped load balancer is created for a workload, it MUST restrict
          inbound traffic to an approved source address allowlist.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Set load balancer source ranges or the equivalent provider firewall rules, and
          reject externally scoped services that omit them.
      - id: CCC.K8S.CN19.AR03
        text: |
          When a Service is created or updated, it MUST NOT set external IP addresses unless
          they are explicitly approved.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Deny the externalIPs field through admission policy, because it can be used to
          intercept traffic destined for other addresses.
      - id: CCC.K8S.CN19.AR04
        text: |
          When a Service is created in a user workload namespace, it MUST NOT be of type
          NodePort.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Expose workloads through internal or source-restricted load balancers instead of
          node ports, and deny type NodePort through admission policy. A zero NodePort
          quota is not suitable because it also counts the node ports of LoadBalancer
          Services, unless allocateLoadBalancerNodePorts is false.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH17
            strength: 6 # Restricted entry points reduce responses to untrusted sources.
            remarks: Responses are Generated for Unauthorized Requests
          - reference-id: CCC.K8S.TH10
            strength: 10
            remarks: Workload Endpoints are Exposed Unintentionally
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-7
            remarks: Boundary Protection
          - reference-id: AC-4
            remarks: Information Flow Enforcement
      - reference-id: CRI
        entries:
          - reference-id: PR.IR-01.01
            remarks: Network segmentation

  - id: CCC.K8S.CN20
    group: Compute
    title: Distribute Cluster Capacity Across Availability Zones
    objective: |
      Ensure that the loss of a single availability zone does not make the cluster
      control plane or its workload capacity unavailable.
    assessment-requirements:
      - id: CCC.K8S.CN20.AR01
        text: |
          When a cluster is created, its control plane MUST be provisioned across multiple
          availability zones.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Select the regional or highly available control-plane tier of the service, where
          the service offers one. Where the service always runs the control plane across
          multiple zones, the provider's documented architecture is sufficient evidence.
      - id: CCC.K8S.CN20.AR02
        text: |
          When a worker pool is created, it MUST span at least two availability zones.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure each worker pool with subnets or zones in multiple availability zones and
          size remaining capacity to carry workloads when one zone is lost.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.K8S.TH21
            strength: 9 # Zone distribution does not protect against loss of the whole region.
            remarks: Cluster Capacity is Lost with a Single Availability Zone
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: CP-6
            remarks: Alternate Storage Site
          - reference-id: CP-10
            remarks: System Recovery and Reconstitution

  - id: CCC.K8S.CN21
    group: Networking
    title: Encrypt Intra-Cluster Workload Traffic
    objective: |
      Ensure that traffic between workloads inside the cluster network cannot be read or
      altered by other workloads, nodes, or network observers.
    assessment-requirements:
      - id: CCC.K8S.CN21.AR01
        text: |
          When a workload communicates with another workload inside the cluster, the traffic
          MUST be encrypted in transit between pods, including traffic that crosses nodes.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Enforce mutual TLS through a service mesh or enable transparent node-to-node
          encryption in a network-policy-capable data plane. Verify that the encryption
          covers every namespace that carries sensitive data, and apply CCC.Core.CN01 to
          any port exposed outside the cluster.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH02
            strength: 9 # Encryption protects content but not the existence of the flow.
            remarks: Data is Intercepted in Transit
          - reference-id: CCC.K8S.TH06
            strength: 4 # Encryption limits lateral interception but does not stop connections.
            remarks: Workload Network Segmentation is Not Enforced
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-8
            remarks: Transmission Confidentiality and Integrity
          - reference-id: SC-13
            remarks: Cryptographic Protection

  - id: CCC.K8S.CN22
    group: Data
    title: Back Up Cluster State and Persistent Volumes
    objective: |
      Ensure that cluster configuration and persistent workload data can be restored after
      deletion, corruption, or loss of the cluster.
    assessment-requirements:
      - id: CCC.K8S.CN22.AR01
        text: |
          When a cluster hosts persistent workload data, its persistent volumes MUST be
          backed up on a scheduled basis to a location outside the cluster.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use the cloud provider's managed backup service for Kubernetes or a cluster backup
          tool, and store backups in a separate account, project, or subscription. Retention
          and immutability are governed by CCC.Core.CN14.
      - id: CCC.K8S.CN22.AR02
        text: |
          When a cluster backup exists, a restore of it MUST have been completed successfully
          to an isolated test cluster within the past 12 months.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Exercise restores of both resource definitions and volume data, and record the
          recovery time achieved against the organization's recovery objective.
      - id: CCC.K8S.CN22.AR03
        text: |
          When a workload is deployed to a cluster, the Kubernetes resource definitions that
          describe it MUST be maintained in version-controlled source outside the cluster.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Deploy workloads from a version-controlled repository through a pipeline or GitOps
          controller so the cluster can be rebuilt from source. Reference Secret values from
          an external secrets service rather than committing them.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH06
            strength: 9 # Backups restore data but cannot prevent the loss itself.
            remarks: Data is Lost or Corrupted
          - reference-id: CCC.K8S.TH21
            strength: 5 # Backups enable rebuild in another zone but do not keep the cluster running.
            remarks: Cluster Capacity is Lost with a Single Availability Zone
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: CP-9
            remarks: System Backup
          - reference-id: CP-10
            remarks: System Recovery and Reconstitution

  - id: CCC.K8S.CN23
    group: Observability
    title: Detect Suspicious Workload Runtime Activity
    objective: |
      Ensure that suspicious process, file, and network activity inside running containers
      and on worker nodes is detected and reported to a security function.
    assessment-requirements:
      - id: CCC.K8S.CN23.AR01
        text: |
          When a cluster is operational, runtime threat detection MUST be enabled for its
          nodes and workloads and MUST alert an authorized security function on suspicious
          container activity.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable the service's managed runtime threat detection or deploy an equivalent
          eBPF-based sensor, and route alerts for interactive shells in containers, unexpected
          process execution, cryptominer behavior, and container drift to the security
          function. Test alert delivery regularly.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH15
            strength: 5 # Runtime detection surfaces enumeration but does not prevent it.
            remarks: Automated Enumeration and Reconnaissance by Non-human Entities
          - reference-id: CCC.K8S.TH05
            strength: 3 # Detection reveals escape attempts after the fact and does not block them.
            remarks: Privileged Workloads Escape Isolation
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-4
            remarks: System Monitoring
      - reference-id: CRI
        entries:
          - reference-id: DE.CM-09.03
            remarks: Unauthorized software, hardware, or configuration changes
