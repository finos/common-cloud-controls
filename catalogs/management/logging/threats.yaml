threats:
  - id: CCC.Logging.TH01
    group: Observability
    title: Log Ingestion Performance Degradation
    description: |
      Log volume bursts, ingestion quota throttling, network bottlenecks,
      slow transformation rules, or custom-format entries that fail to parse
      may delay the ingestion pipeline or overflow agent and sink buffers. Log
      entries arrive late or are dropped, so log-based metrics under-count,
      detections fire after the fact and the audit trail has gaps, reducing the
      availability and integrity of log data.
    capabilities:
      - reference-id: CCC.Logging
        entries:
          - reference-id: CCC.Logging.CP03
            strength: 0 # Not yet specified
            remarks: Real-Time Log Ingestion
          - reference-id: CCC.Logging.CP04
            strength: 0 # Not yet specified
            remarks: Centralised Log Collection
          - reference-id: CCC.Logging.CP05
            strength: 0 # Not yet specified
            remarks: Custom Log Format Support
          - reference-id: CCC.Logging.CP06
            strength: 0 # Not yet specified
            remarks: Log Filtering and Transformation
          - reference-id: CCC.Logging.CP11
            strength: 0 # Not yet specified
            remarks: Log-based Metrics
  - id: CCC.Logging.TH02
    group: Data
    title: Unauthorized Data Transfer Out of a Trusted Boundary
    description: |
      Sensitive log data, including PII, financial transaction details, or
      system vulnerabilities, may be exfiltrated through the query or API
      interfaces by a compromised or over-privileged account, or routed out by
      a sink configured to deliver logs to a destination outside the trusted
      boundary. Log data leaves the organisation's control, compromising its
      confidentiality.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.CP06
            strength: 0 # Not yet specified
            remarks: Access Control
          - reference-id: CCC.Core.CP14
            strength: 0 # Not yet specified
            remarks: API Access
          - reference-id: CCC.Core.CP22
            strength: 0 # Not yet specified
            remarks: Location Lock-In
      - reference-id: CCC.Logging
        entries:
          - reference-id: CCC.Logging.CP09
            strength: 0 # Not yet specified
            remarks: Internal Sink
          - reference-id: CCC.Logging.CP10
            strength: 0 # Not yet specified
            remarks: External Sink
  - id: CCC.Logging.TH04
    group: Observability
    title: Sensitive Data is Logged Without Masking
    description: |
      Sensitive data (e.g., PII, secrets, authentication tokens) is ingested
      into logs without proper anonymization, masking, or redaction at source
      or during ingestion. This creates a significant data exposure risk,
      particularly for data not intended for broad log access.
    capabilities:
      - reference-id: CCC.Logging
        entries:
          - reference-id: CCC.Logging.CP06
            strength: 0 # Not yet specified
            remarks: Log Filtering and Transformation
          - reference-id: CCC.Logging.CP14
            strength: 0 # Not yet specified
            remarks: Sensitive Data Masking
  - id: CCC.Logging.TH05
    group: Observability
    title: Log Retention Policy Evasion or Misconfiguration
    description: |
      Log data is deleted prematurely or retained longer than legally required
      due to misconfigured retention policies, manual overrides, or evasion
      tactics. This can lead to non-compliance with regulatory requirements
      or loss of critical forensic evidence.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.CP32
            strength: 0 # Not yet specified
            remarks: Deletion Protection
          - reference-id: CCC.Core.CP34
            strength: 0 # Not yet specified
            remarks: Data Lifecycle Policy
  - id: CCC.Logging.TH06
    group: Ingestion
    title: Log Injection
    description: |
      User-supplied data such as scripts, control characters, escape sequences,
      or code fragments may be written to logs without proper encoding or sanitization.
      This can result in malformed or unexpected log entries that could disrupt or
      compromise systems that process or display these logs, including log viewers
      or downstream services.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.CP10
            strength: 0 # Not yet specified
            remarks: Log Publication
      - reference-id: CCC.Logging
        entries:
          - reference-id: CCC.Logging.CP01
            strength: 0 # Not yet specified
            remarks: Service Log Capture
          - reference-id: CCC.Logging.CP02
            strength: 0 # Not yet specified
            remarks: Application Log Ingestion
  - id: CCC.Logging.TH07
    group: Observability
    title: Insufficient Logging
    description: |
      Security-critical actions may not be logged because log capture is not
      enabled for a source, verbosity is set too low, or a filter or
      transformation rule discards the relevant entries at ingestion. The
      events are absent from the log store, so threats go undetected and
      post-incident analysis lacks evidence, reducing the integrity and
      availability of the audit trail.
    capabilities:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.CP10
            strength: 0 # Not yet specified
            remarks: Log Publication
      - reference-id: CCC.Logging
        entries:
          - reference-id: CCC.Logging.CP01
            strength: 0 # Not yet specified
            remarks: Service Log Capture
          - reference-id: CCC.Logging.CP02
            strength: 0 # Not yet specified
            remarks: Application Log Ingestion
          - reference-id: CCC.Logging.CP06
            strength: 0 # Not yet specified
            remarks: Log Filtering and Transformation
