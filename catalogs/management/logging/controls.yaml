controls:
  - id: CCC.Logging.CN01
    group: Observability
    title: Centralized and Comprehensive Log Aggregation
    objective: |
      Ensure all operational and security logs from across the cloud environment, including
      applications, operating systems, network traffic, and cloud service activity, are captured
      automatically and streamed to a central, secure log management service.
    assessment-requirements:
      - id: CCC.Logging.CN01.AR01
        text: |
          When a new cloud account or project is created, provider-level audit logging for it MUST be
          enabled.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Logging.CN01.AR02
        text: |
          When a new cloud compute resource is deployed, it MUST be configured to forward all relevant
          logs (e.g., OS, application, service logs) to the central log sink.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Logging.CN01.AR03
        text: |
          When provider-level audit or network flow logs are generated, the service MUST receive them in
          the central log sink.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH07
            strength: 0 # Not yet specified
            remarks: Security-relevant Events are Not Logged
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.PS-04
      - reference-id: NIST_800_53
        entries:
          - reference-id: AU-2
            strength: 0 # Not yet specified
          - reference-id: AU-3
  - id: CCC.Logging.CN02
    group: Observability
    title: Enforce Data Retention Policy for Logs
    objective: |
      Ensure that the retention period configured for logs aligns with the organization's
      data retention policy.
    assessment-requirements:
      - id: CCC.Logging.CN02.AR01
        text: |
          When a new log bucket or stream is created, its retention policy MUST be configured
          in accordance with organisation's data retention policy.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Logging.CN02.AR02
        text: |
          When a query is performed to retrieve log events older than the number of days defined
          in the organisation's data retention policy, it MUST return an empty result.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH05
            strength: 0 # Not yet specified
            remarks: Logs are Deleted Early or Retained Beyond Policy
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: GV.PO-01
      - reference-id: NIST_800_53
        entries:
          - reference-id: AU-11
  - id: CCC.Logging.CN03
    group: Observability
    title: Enable Object Lock On Log Bucket
    objective: |
      Ensure log immutability by enabling Write Once, Read Many (WORM) protection
      using object lock on log storage buckets. This prevents logs from being modified
      or deleted during the defined retention period, supporting compliance and forensic
      integrity.
    assessment-requirements:
      - id: CCC.Logging.CN03.AR01
        text: |
          When an attempt is made to modify or delete data before the object
          lock period expires, then the action MUST be denied.
        applicability:
          - tlp-red
          - tlp-amber
        recommendation: |
          Configure object lock policy.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH07
            strength: 0 # Not yet specified
            remarks: Logs are Tampered With or Deleted
          - reference-id: CCC.Core.TH06
            strength: 0 # Not yet specified
            remarks: Data is Lost or Corrupted
          - reference-id: CCC.Logging.TH05
            strength: 0 # Not yet specified
            remarks: Logs are Deleted Early or Retained Beyond Policy
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.PS-04
      - reference-id: NIST_800_53
        entries:
          - reference-id: AU-9
            strength: 0 # Not yet specified
          - reference-id: AU-11
  - id: CCC.Logging.CN04
    group: Access
    title: Restrict Field And Log Type Access
    objective: |
      Configure access to logs to follow the principle of least privilege in particular where technically
      possible limit the log fields users have access to to prevent accidental exposure to sensitive
      information such as PII.
    assessment-requirements:
      - id: CCC.Logging.CN04.AR01
        text: |
          When restricted fields are accessed by unauthorized users, then those fields MUST remain masked.
        applicability:
          - tlp-red
          - tlp-amber
        recommendation: |
          Review field level access controls on log data.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH04
            strength: 0 # Not yet specified
            remarks: Sensitive Data is Logged Without Masking
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.PS-04
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-6
            strength: 0 # Not yet specified
          - reference-id: AU-9
            strength: 0 # Not yet specified
          - reference-id: AC-3
            strength: 0 # Not yet specified
          - reference-id: PT-2
            strength: 0 # Not yet specified
          - reference-id: PT-3
  - id: CCC.Logging.CN05
    group: Access
    title: Ensure Log Bucket is Not Publicly Accessible
    objective: |
      Ensure that log storage buckets are not publicly accessible to prevent unauthorized
      access to sensitive log data.
    assessment-requirements:
      - id: CCC.Logging.CN05.AR01
        text: |
          When a log storage bucket is created, the bucket's access control settings MUST
          explicitly deny public read and write access.
        applicability:
          - tlp-red
          - tlp-amber
          - tlp-green
        recommendation: |
          Configure bucket policies and access control lists (ACLs) to restrict public access.
          Regularly review bucket permissions to ensure no public access has been inadvertently granted.
      - id: CCC.Logging.CN05.AR02
        text: |
          When the URL of a log storage bucket's object is accessed publicly, the action MUST be denied
          by bucket policy.
        applicability:
          - tlp-red
          - tlp-amber
          - tlp-green
        recommendation: |
          Configure bucket policies and access control lists (ACLs) to restrict public access.
          Regularly review bucket permissions to ensure no public access has been inadvertently granted.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            strength: 0 # Not yet specified
            remarks: Access is Granted to Unauthorized Users
          - reference-id: CCC.Core.TH17
            strength: 0 # Not yet specified
            remarks: Responses are Generated for Unauthorized Requests
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.AA-05
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
            strength: 0 # Not yet specified
          - reference-id: SC-7
  - id: CCC.Logging.CN06
    group: Observability
    title: Detect and Alert on Potential Log Exfiltration
    objective: |
      Identify and alert on anomalous data access patterns that may indicate an attempt
      to exfiltrate log data.
    assessment-requirements:
      - id: CCC.Logging.CN06.AR01
        text: |
          When a single principal executes an anomalously high number of log queries,
          an alert MUST be generated.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH02
            strength: 0 # Not yet specified
            remarks: Log Data is Transferred Outside the Trust Boundary
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: DE.CM-03
            strength: 0 # Not yet specified
          - reference-id: DE.CM-09
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-4
            strength: 0 # Not yet specified
          - reference-id: CA-7
            strength: 0 # Not yet specified
          - reference-id: AU-6
  - id: CCC.Logging.CN07
    group: Observability
    title: Detect and Alert on Log Service Tampering
    objective: |
      Alert when any component of the critical logging infrastructure is disabled, modified,
      or deleted, indicating a defense evasion attempt. This extends the obligation of core
      CN16 to tlp-clear and tlp-green for this service, pending a WG decision on CN16's
      applicability.
    assessment-requirements:
      - id: CCC.Logging.CN07.AR01
        text: |
          When an audit log event is recorded that corresponds to a modification of the logging service
          configuration such as disabling a log trail, deleting a log sink, or altering a log forwarding rule,
          an alert MUST be generated.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH16
            strength: 0 # Not yet specified
            remarks: Publications are Disabled
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: DE.CM-03
            strength: 0 # Not yet specified
          - reference-id: DE.CM-09
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-4
            strength: 0 # Not yet specified
          - reference-id: CA-7
            strength: 0 # Not yet specified
          - reference-id: AU-6
  - id: CCC.Logging.CN08
    group: Data
    title: Restrict Log Sink Destinations to the Trust Perimeter
    objective: |
      Ensure that log data can only be routed to sink or export destinations inside the
      organisation's defined trust perimeter, so that a misconfigured or compromised sink
      cannot deliver logs to an external party. Routing logs to a sink is not data
      replication, so this control is distinct from core CN10.
    assessment-requirements:
      - id: CCC.Logging.CN08.AR01
        text: |
          When a log sink or export destination outside the organisation's defined trust perimeter is
          created or modified, the service MUST deny the request.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Use organisation-level policy to constrain sink destinations to accounts, projects, or
          resources owned by the organisation.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH02
            strength: 0 # Not yet specified
            remarks: Log Data is Transferred Outside the Trust Boundary
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.DS-10
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-4
            strength: 0 # Not yet specified
          - reference-id: SC-7
  - id: CCC.Logging.CN09
    group: Observability
    title: Alert on Log Ingestion Failure
    objective: |
      Ensure that throttled, rejected, or silently missing log data is detected promptly, so
      that gaps in the audit trail are visible before they hinder detection or forensics.
    assessment-requirements:
      - id: CCC.Logging.CN09.AR01
        text: |
          When log events are throttled or rejected for exceeding an ingestion quota, the service MUST
          generate an alert.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Logging.CN09.AR02
        text: |
          When no log entry has been received from a configured log source for longer than the
          organisation's defined heartbeat interval, the service MUST generate an alert.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH01
            strength: 0 # Not yet specified
            remarks: Log Entries are Delayed or Dropped During Ingestion
          - reference-id: CCC.Core.TH12
            strength: 0 # Not yet specified
            remarks: Resource Constraints are Exhausted
          - reference-id: CCC.Core.TH16
            strength: 0 # Not yet specified
            remarks: Publications are Disabled
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: DE.CM-09
      - reference-id: NIST_800_53
        entries:
          - reference-id: AU-4
            strength: 0 # Not yet specified
          - reference-id: AU-5
  - id: CCC.Logging.CN10
    group: Ingestion
    title: Preserve Log Entry Boundaries on Ingestion
    objective: |
      Ensure that user-supplied content inside a log entry cannot create, split, or alter log
      records, so that injected control characters do not forge entries or disrupt downstream
      processing.
    assessment-requirements:
      - id: CCC.Logging.CN10.AR01
        text: |
          When a log entry containing line breaks or control characters is ingested, the service MUST
          store it as a single structured log record.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Logging.TH06
            strength: 0 # Not yet specified
            remarks: Forged or Malformed Entries are Written to Logs
    guidelines:
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-10
