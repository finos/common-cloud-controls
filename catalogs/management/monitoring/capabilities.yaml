capabilities:
  - id: CCC.Monitor.CP01
    group: Observability
    title: Custom Metric Ingestion
    description: |
      The service can receive user-defined, numeric time-series data points
      pushed by applications or external systems through its API, in addition
      to the metrics it collects automatically from provider resources.
  - id: CCC.Monitor.CP02
    group: Observability
    title: Distributed Tracing
    description: |
      The service may be configured to collect traces that link a single request
      to the resulting operations in downstream components and external systems,
      providing an end-to-end view of a transaction.
  - id: CCC.Monitor.CP05
    group: Observability
    title: Service Level Objective Monitoring
    description: |
      The service may be configured to evaluate user-defined service level
      objectives against service level indicators derived from collected metrics,
      and to report the remaining error budget.
  - id: CCC.Monitor.CP06
    group: Observability
    title: Synthetic Monitoring
    description: |
      The service may be configured to run scripted sample user interactions
      against an application on a schedule from provider-operated locations,
      in order to identify issues before real users are impacted.
  - id: CCC.Monitor.CP07
    group: Observability
    title: Uptime Monitoring
    description: |
      The service may be configured to probe an endpoint from external
      provider-operated locations on a schedule and record whether it is
      reachable and responding.
  - id: CCC.Monitor.CP08
    group: Observability
    title: Application Performance Monitoring
    description: |
      The service may be configured to collect application-level telemetry such
      as request latency, error rates, and dependency calls through
      instrumentation, in order to monitor performance and user experience.
  - id: CCC.Monitor.CP09
    group: Observability
    title: Dashboards
    description: |
      The service can present metrics, alerts, service level objectives, and
      uptime results in user-defined visual dashboards that may be shared with
      other users.
  - id: CCC.Monitor.CP10
    group: Observability
    title: Alert-Triggered Actions
    description: |
      The service may be configured to invoke an automated action, such as a
      workflow, a function, or a scaling operation, when an alert condition is
      met, in addition to emitting a notification.
  - id: CCC.Monitor.CP11
    group: Observability
    title: Integration with External Tools
    description: |
      The service may be configured to forward alerts, notifications, and metric
      data to external systems such as incident management, ticketing, or
      third-party observability platforms.
  - id: CCC.Monitor.CP12
    group: Observability
    title: Agent-Based Telemetry Collection
    description: |
      The service can collect metrics and traces from compute instances through
      a provider-supplied agent that runs on the instance and authenticates to
      the service using the instance identity or a configured credential.
  - id: CCC.Monitor.CP13
    group: Observability
    title: Alert Suppression
    description: |
      The service may be configured to suppress or snooze alert notifications
      for a period of time or for matching conditions, so that alerts are not
      delivered during maintenance or known incidents.
  - id: CCC.Monitor.CP14
    group: Access
    title: Cross-Account Monitoring Scope
    description: |
      The service may be configured to aggregate metrics from multiple accounts,
      subscriptions, or projects into a single monitoring scope, so that users
      of the scope can view telemetry across tenancy boundaries.
