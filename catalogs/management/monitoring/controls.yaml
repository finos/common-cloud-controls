controls:
  - id: CCC.Monitor.CN01
    group: Observability
    title: Limit Monitoring Probe Load on Targets
    objective: |
      Ensure that synthetic and uptime checks cannot consume the capacity of the
      endpoints they monitor.
    assessment-requirements:
      - id: CCC.Monitor.CN01.AR01
        text: |
          When a synthetic or uptime check is configured, its aggregate request rate
          across all probe locations MUST NOT exceed the rate approved for the target
          endpoint.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN01.AR02
        text: |
          When the aggregate probe rate against a target endpoint exceeds the approved
          rate, the service MUST generate an alert.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH03
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.IR-01
            strength: 0 # Not yet specified
          - reference-id: DE.CM-01
      - reference-id: NIST_800_53
        entries:
          - reference-id: SC-5
            strength: 0 # Not yet specified
          - reference-id: SC-7
  - id: CCC.Monitor.CN03
    group: Access
    title: Restrict Monitoring Probe Reach
    objective: |
      Ensure that synthetic and uptime checks that reach non-public endpoints
      cannot be used as a path into other internal systems.
    assessment-requirements:
      - id: CCC.Monitor.CN03.AR01
        text: |
          When a synthetic or uptime check targets an endpoint that is not publicly
          reachable, the check MUST run with an identity whose permissions are
          limited to that target endpoint.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN03.AR02
        text: |
          When a synthetic or uptime check is placed inside a private network, its
          network access MUST be limited to the network segment of the target
          endpoint.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH04
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: DE.CM-06
            strength: 0 # Not yet specified
          - reference-id: PR.IR-01
            strength: 0 # Not yet specified
          - reference-id: PR.AA-05
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
  - id: CCC.Monitor.CN04
    group: Access
    title: Restrict Access to Dashboards and Health Status
    objective: |
      Ensure that dashboards, uptime results, and service level objective status
      are visible only to authorized users.
    assessment-requirements:
      - id: CCC.Monitor.CN04.AR01
        text: |
          When a dashboard, uptime result, or service level objective is shared, the
          service MUST require the viewer to be an authenticated user who is
          authorized on that resource.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH02
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: DE.CM-09
            strength: 0 # Not yet specified
          - reference-id: DE.AE-03
      - reference-id: NIST_800_53
        entries:
          - reference-id: SI-4
            strength: 0 # Not yet specified
          - reference-id: AC-3
  - id: CCC.Monitor.CN05
    group: Access
    title: Restrict Alert Suppression
    objective: |
      Ensure that alerts cannot be silenced, snoozed, or disabled by users other
      than authorized responders, or for an unbounded period.
    assessment-requirements:
      - id: CCC.Monitor.CN05.AR01
        text: |
          When a user suppresses, snoozes, or disables an alert, the service MUST
          require a permission that is granted only to authorized responders.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN05.AR02
        text: |
          When an alert suppression is created, the service MUST require an expiry
          time after which the alert is delivered again.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH08
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.IR-01
            strength: 0 # Not yet specified
          - reference-id: PR.AA-05
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-3
  - id: CCC.Monitor.CN06
    group: Access
    title: Scope Telemetry Publishing Permissions
    objective: |
      Ensure that an identity can publish telemetry only for the resources it
      owns, so that a compromised workload or agent cannot fabricate telemetry
      about other systems or create unbounded metric series.
    assessment-requirements:
      - id: CCC.Monitor.CN06.AR01
        text: |
          When an identity is granted permission to publish metrics or traces, the
          permission MUST be restricted to the metric namespaces or resources that
          the identity owns.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN06.AR02
        text: |
          When a telemetry agent authenticates to the service, it MUST use the
          platform identity of the instance it runs on rather than a stored
          long-lived credential.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH05
          - reference-id: CCC.Monitor.TH06
          - reference-id: CCC.Monitor.TH09
          - reference-id: CCC.Core.TH08
    guidelines:
      - reference-id: NIST-CSF
        entries:
          - reference-id: PR.AA-05
      - reference-id: NIST_800_53
        entries:
          - reference-id: AC-5
  - id: CCC.Monitor.CN07
    group: Observability
    title: Restrict Telemetry to Approved Fields
    objective: |
      Ensure that only explicitly selected metrics, dimensions, and trace
      attributes are collected, so that sensitive data is neither captured in
      telemetry nor carried out through it.
    assessment-requirements:
      - id: CCC.Monitor.CN07.AR01
        text: |
          When agent-based or application telemetry collection is configured, the
          collection configuration MUST specify an explicit allow-list of the
          metrics, dimensions, and trace attributes to collect.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN07.AR02
        text: |
          When trace collection is configured, request and response payloads MUST
          NOT be recorded as trace attributes.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH01
          - reference-id: CCC.Monitor.TH05
  - id: CCC.Monitor.CN08
    group: Access
    title: Restrict Telemetry Destinations and Action Targets
    objective: |
      Ensure that telemetry is forwarded only to approved external systems and
      that alerts can invoke only approved actions with least-privilege
      identities.
    assessment-requirements:
      - id: CCC.Monitor.CN08.AR01
        text: |
          When a notification channel or telemetry export destination is configured,
          the destination MUST be on an approved list of external systems.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN08.AR02
        text: |
          When an alert-triggered action is configured, the action target MUST be on
          an approved list of functions, workflows, or endpoints.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN08.AR03
        text: |
          When an alert-triggered action is invoked, the service MUST use an identity
          granted only the permissions required by that action.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH01
          - reference-id: CCC.Monitor.TH05
          - reference-id: CCC.Monitor.TH06
          - reference-id: CCC.Monitor.TH07
  - id: CCC.Monitor.CN09
    group: Access
    title: Restrict Cross-Account Monitoring Scope
    objective: |
      Ensure that telemetry is aggregated across accounts, subscriptions, or
      projects only with the authorization of each linked account.
    assessment-requirements:
      - id: CCC.Monitor.CN09.AR01
        text: |
          When an account, subscription, or project is linked into a monitoring
          scope, the link MUST be authorized from within the linked account.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.Monitor.CN09.AR02
        text: |
          When a monitoring scope is configured, the set of linked accounts MUST
          match the approved list of accounts for that scope.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Monitor.TH10
