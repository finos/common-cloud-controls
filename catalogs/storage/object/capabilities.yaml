capabilities:
  - id: CCC.ObjStor.CP01
    group: Data
    title: Storage Buckets
    description: |
      The service always provides buckets as uniquely identifiable containers in
      which objects are stored and to which access policies and configuration
      are applied.

  - id: CCC.ObjStor.CP02
    group: Data
    title: Storage Objects
    description: |
      The service always stores each data element as an object that contains
      both the data and its metadata, addressed by a unique key within a bucket.

  - id: CCC.ObjStor.CP05
    group: Data
    title: Store New Objects
    description: |
      The service always allows a user to store a new object in a bucket under
      a key that is not yet in use.

  - id: CCC.ObjStor.CP06
    group: Data
    title: Replace Stored Objects
    description: |
      The service always allows a user to replace an object in a bucket by
      writing a new object to the same key, overwriting the previous content
      unless versioning retains it.

  - id: CCC.ObjStor.CP07
    group: Data
    title: Delete Stored Objects
    description: |
      The service always allows a user to delete an object from a bucket given
      the object key.

  - id: CCC.ObjStor.CP10
    group: Access
    title: Object Level Access Control
    description: |
      The service can enforce access permissions on an individual object,
      independently of the permissions applied to the containing bucket.
      Whether object-level permissions are enabled by default on a new bucket
      varies by provider.

  - id: CCC.ObjStor.CP12
    group: Resource
    title: Storage Classes
    description: |
      The service always offers multiple storage classes with differing
      durability, availability and retrieval latency, and an object may be
      configured to use a class other than the default.

  - id: CCC.ObjStor.CP14
    group: Encryption
    title: Customer-Provided Encryption Keys
    description: |
      The service can encrypt an object at rest with a key that the user supplies
      in each request and that the service does not retain, so the object can only
      be read by presenting the same key again.

  - id: CCC.ObjStor.CP15
    group: Access
    title: Cross-Origin Resource Sharing
    description: |
      The service may be configured with a cross-origin resource sharing (CORS)
      policy on a bucket that determines which web origins a browser is permitted
      to request objects from.

  - id: CCC.ObjStor.CP16
    group: Access
    title: Bucket-Level-Only Access Policy
    description: |
      The service may be configured to disable object-level permissions on a
      bucket, so that access to every object is governed solely by the
      bucket-level policy.

  - id: CCC.ObjStor.CP17
    group: Data
    title: Object Immutability
    description: |
      The service may be configured to lock an object or a bucket so that its
      objects cannot be overwritten or deleted until a retention period expires,
      and the lock itself may be made irrevocable.
