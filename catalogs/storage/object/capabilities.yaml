capabilities:
  - id: CCC.ObjStor.CP01
    group: Data
    title: Storage Buckets
    description: |
      Provides uniquely identifiable segmentations in which data elements may
      be stored.

  - id: CCC.ObjStor.CP02
    group: Data
    title: Storage Objects
    description: |
      Supports storing, accessing, and managing data elements which contain
      both data and metadata.

  - id: CCC.ObjStor.CP05
    group: Data
    title: Store New Objects
    description: |
      Supports for storing a new object in the bucket.

  - id: CCC.ObjStor.CP06
    group: Data
    title: Replace Stored Objects
    description: |
      Supports for replacing an object in the bucket with a new object for the same key.

  - id: CCC.ObjStor.CP07
    group: Data
    title: Delete Stored Objects
    description: |
      Supports for deleting objects from the bucket given the object key.

  - id: CCC.ObjStor.CP10
    group: Access
    title: Object Level Access Control
    description: |
      Supports controlling access to specific objects within the object store.

  - id: CCC.ObjStor.CP12
    group: Resource
    title: Storage Classes
    description: |
      Provides different storage classes for frequently and infrequently
      accessed objects.

  - id: CCC.ObjStor.CP14
    group: Encryption
    title: Customer-Provided Encryption Keys
    description: |
      The service can encrypt an object at rest with a key that the user supplies
      in each request and that the service does not retain, so the object can only
      be read by presenting the same key again.

  - id: CCC.ObjStor.CP15
    group: Access
    title: Cross-Origin Resource Sharing
    description: |
      The service may be configured with a cross-origin resource sharing (CORS)
      policy on a bucket that determines which web origins a browser is permitted
      to request objects from.

  - id: CCC.ObjStor.CP16
    group: Access
    title: Uniform Bucket-Level Access
    description: |
      The service may be configured to disable object-level permissions on a
      bucket, so that access to every object is governed solely by the
      bucket-level policy.
