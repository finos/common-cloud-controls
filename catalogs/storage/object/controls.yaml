imports:
  - reference-id: CCC
    entries:
      - reference-id: CCC.Core.CN01
        remarks: Prevent Unencrypted Requests
      - reference-id: CCC.Core.CN02
        remarks: Ensure Data Encryption at Rest for All Stored Data
      - reference-id: CCC.Core.CN03
        remarks: Implement Multi-factor Authentication (MFA) for Access
      - reference-id: CCC.Core.CN04
        remarks: Log All Access and Changes
      - reference-id: CCC.Core.CN05
        remarks: Prevent Access from Untrusted Entities
      - reference-id: CCC.Core.CN06
        remarks: Prevent Deployment in Restricted Regions
      - reference-id: CCC.Core.CN07
        remarks: Alert on Unusual Enumeration Activity
      - reference-id: CCC.Core.CN09
        remarks: Prevent Tampering, Deletion, or Unauthorized Access to Access Logs
      - reference-id: CCC.Core.CN10
        remarks: Prevent Data Replication to Destinations Outside of Defined Trust Perimeter

controls:
  - id: CCC.ObjStor.CN01
    group: Encryption
    title: Prevent Requests to Buckets or Objects with Untrusted KMS Keys
    objective: |
      Prevent any requests to object storage buckets or objects using
      untrusted KMS keys to protect against unauthorized data encryption,
      or sensitive data decryption.
    assessment-requirements: # Restrict write on all; Restrict read on amber or red
      - id: CCC.ObjStor.CN01.AR01
        text: |
          When a request is made to read a bucket, the service
          MUST prevent any request using KMS keys not listed as trusted by
          the organization.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN01.AR02
        text: |
          When a request is made to read an object, the service
          MUST prevent any request using KMS keys not listed as trusted by
          the organization.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN01.AR03
        text: |
          When a request is made to write to a bucket, the service MUST
          prevent any request using KMS keys not listed as trusted by the
          organization.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN01.AR04
        text: |
          When a request is made to write to an object, the service MUST
          prevent any request using KMS keys not listed as trusted by the
          organization.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            remarks: Access is Granted to Unauthorized Users
            strength: 5 # Only addresses the threat of users with bad keys, not the threat of users with no keys
          - reference-id: CCC.Core.TH06
            remarks: Data is Lost or Corrupted
            strength: 2 # This is just one of many ways to mess up the data
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: IAM-01
            remarks: IAM Policy and Procedures
            strength: 3 # Implmenting this control is indicative of larger planning efforts
          - reference-id: IAM-03
            remarks: Identity Inventory (system identities and level of access)
            strength: 5 # This control enforces some level of permission scoping for keys
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 1 # This is one of many things that will need to be done
  - id: CCC.ObjStor.CN03
    group: Data
    title: Prevent Bucket Deletion Through Irrevocable Bucket Retention Policy
    objective: |
      Ensure that object storage bucket is not deleted after creation,
      and that the preventative measure cannot be unset.
    assessment-requirements:
      - id: CCC.ObjStor.CN03.AR01
        text: |
          When an object storage bucket deletion is attempted, the bucket MUST be
          fully recoverable for a set time-frame after deletion is requested.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN03.AR02
        text: |
          When an attempt is made to modify the retention policy for an object
          storage bucket, the service MUST prevent the policy from being modified.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH06
            remarks: Data is Lost or Corrupted
            strength: 2 # This is just one of many ways to mess up the data
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-16
            remarks: Data Retention and Deletion
            strength: 10 # Have a policy? Check. Follow it? Check.
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 1 # This is one of many things that will need to be done
  - id: CCC.ObjStor.CN04
    group: Data
    title: Objects have an Effective Retention Policy by Default
    objective: |
      Ensure that all objects stored in the object storage system have a
      retention policy applied by default, preventing premature deletion
      or modification of objects.
    assessment-requirements:
      - id: CCC.ObjStor.CN04.AR01
        text: |
          When an object is uploaded to the object storage system, the object
          MUST automatically receive a default retention policy that prevents
          premature deletion or modification.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN04.AR02
        text: |
          When an attempt is made to delete or modify an object that is subject
          to an active retention policy, the service MUST prevent the action
          from being completed.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH06
            remarks: Data is Lost or Corrupted
            strength: 2 # This is just one of many ways to mess up the data
      - reference-id: CCC.ObjStor
        entries:
          - reference-id: CCC.ObjStor.TH01
            remarks: Data Exfiltration via Insecure Lifecycle Policies
            strength: 10 # mmmm... lifecycle policies
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-16
            remarks: Data Retention and Deletion
            strength: 10 # Have a policy? Check. Follow it? Check.
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 1 # This is one of many things that will need to be done
  - id: CCC.ObjStor.CN05
    group: Data
    title: Versioning is Enabled for All Objects in the Bucket
    objective: |
      Ensure that versioning is enabled for all objects stored in the object
      storage bucket to enable recovery of previous versions of objects in
      case of loss or corruption.
    assessment-requirements:
      - id: CCC.ObjStor.CN05.AR01
        text: |
          When an object is uploaded to the object storage bucket, the object
          MUST be stored with a unique identifier.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN05.AR02
        text: |
          When an object is modified, the service MUST assign a new unique
          identifier to the modified object to differentiate it from the
          previous version.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN05.AR03
        text: |
          When an object is modified, the service MUST allow for recovery
          of previous versions of the object.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN05.AR04
        text: |
          When an object is deleted, the service MUST retain other versions of
          the object to allow for recovery of previous versions.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH06
            remarks: Data is Lost or Corrupted
            strength: 2 # This is just one of many ways to mess up the data
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-16
            remarks: Data Retention and Deletion
            strength: 10 # Have a policy? Check. Follow it? Check.
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 1 # This is one of many things that will need to be done
  - id: CCC.ObjStor.CN07
    group: Access
    title: Multi-Factor Authentication Is Required for Object Deletion
    objective: |
      Ensure that deletion of objects stored in the object storage system is
      protected by multi-factor authentication (MFA), reducing the risk of
      accidental, unauthorized, or compromised-credential–based data destruction.
    assessment-requirements:
      - id: CCC.ObjStor.CN07.AR01
        text: |
          The object storage service MUST support a configuration option that
          requires MFA to be successfully completed before any object deletion
          can be attempted, regardless of the request interface.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN07.AR02
        text: |
          When MFA deletion protection is enabled on a bucket or object
          namespace, the service MUST deny any deletion request from an identity
          that has not satisfied the MFA requirement at the time of the request.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN07.AR03
        text: |
          When an attempt is made to delete an object, the service's audit logs MUST
          clearly record each deletion attempt, including whether MFA was required
          and whether validation was met.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            remarks: Prevents unauthorized identities from deleting objects
            strength: 9
          - reference-id: CCC.Core.TH06
            remarks: Mitigates malicious or accidental data loss through protected deletion
            strength: 10
          - reference-id: CCC.Core.TH17
            remarks: Ensures deletion requests from unauthorized entities do not result in action
            strength: 8
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-16
            remarks: MFA enforcement strengthens data retention and deletion control
            strength: 8
          - reference-id: IAM-12
            remarks: MFA required for privileged or destructive operations
            strength: 9

  - id: CCC.ObjStor.CN02
    group: Access
    title: Enforce Uniform Bucket-level Access to Prevent Inconsistent Permissions
    objective: |
      Ensure that uniform bucket-level access is enforced across all
      object storage buckets. This prevents the use of ad-hoc or
      inconsistent object-level permissions, ensuring centralized,
      consistent, and secure access management in accordance with the
      principle of least privilege.
    assessment-requirements:
      - id: CCC.ObjStor.CN02.AR01
        text: |
          When a permission set is allowed for an object in a bucket, the
          service MUST allow the same permission set to access all objects
          in the same bucket.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
      - id: CCC.ObjStor.CN02.AR02
        text: |
          When a permission set is denied for an object in a bucket, the
          service MUST deny the same permission set to access all objects
          in the same bucket.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: ""
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            remarks: Access is Granted to Unauthorized Users
            strength: 2 # This helps reduce errors and oversight when the intent is on point
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: IAM-08
            remarks: User Access Review
            strength: 2 # Reducing IAM nuance and exceptions helps streamline reviews


  - id: CCC.ObjStor.CN08
    group: Access
    title: Enforce Constraints on Pre-Signed URL Generation
    objective: |
      Ensure that pre-signed URLs are generated with minimum necessary
      permissions, limited expiry durations, and auditable generation
      events to prevent unauthorized access through leaked or overly
      permissive URLs.
    assessment-requirements:
      - id: CCC.ObjStor.CN08.AR01
        text: |
          When a pre-signed URL is generated, the service MUST enforce a
          maximum expiry duration that does not exceed an
          organization-defined threshold.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure a maximum TTL policy for pre-signed URLs. For sensitive
          data, consider expiry durations of 15 minutes or less. Review and
          adjust thresholds based on operational requirements.
      - id: CCC.ObjStor.CN08.AR02
        text: |
          When a pre-signed URL is generated, the service MUST restrict
          the URL scope to a single object and a single operation (read or
          write), preventing broad access grants.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Ensure application logic generates URLs scoped to individual
          objects. Avoid wildcard or prefix-based URL generation that could
          expose multiple objects.
      - id: CCC.ObjStor.CN08.AR03
        text: |
          When a pre-signed URL is generated, the service MUST publish an
          auditable log entry that includes the generating identity, the
          target resource, the granted permissions, and the expiry time.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable logging for all pre-signed URL generation events. Integrate
          these logs with existing SIEM or monitoring systems for anomaly
          detection.
      - id: CCC.ObjStor.CN08.AR04
        text: |
          When a pre-signed URL is generated, the service MUST restrict
          generation to identities that have explicit permission to create
          pre-signed URLs, separate from their permission to access the
          underlying object.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Implement a dedicated IAM permission for pre-signed URL generation
          rather than implicitly granting this capability to all entities
          with object-level access.
    threats:
      - reference-id: CCC.ObjStor
        entries:
          - reference-id: CCC.ObjStor.TH02
            remarks: Pre-Signed URL Abuse
            strength: 9
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            remarks: Access is Granted to Unauthorized Users
            strength: 4
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: IAM-01
            remarks: IAM Policy and Procedures
            strength: 5
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 3
          - reference-id: LOG-08
            remarks: Log Records
            strength: 5

  - id: CCC.ObjStor.CN09
    group: Access
    title: Block Public Access by Default
    objective: |
      Ensure that all buckets and objects are protected from public
      (unauthenticated or anonymous) access by default, requiring explicit
      and auditable action to override.
    assessment-requirements:
      - id: CCC.ObjStor.CN09.AR01
        text: |
          When a bucket is created, the service MUST enable a public access
          block that prevents any policy or ACL from granting public access
          to the bucket or its objects.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable account-level or organization-level public access block
          settings to ensure all new buckets inherit this protection by
          default.
      - id: CCC.ObjStor.CN09.AR02
        text: |
          When an attempt is made to modify a bucket policy or ACL to grant
          public access, the service MUST deny the modification unless the
          public access block has been explicitly disabled.
        applicability:
          - tlp-clear
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Configure preventative controls at the organization level so that
          individual bucket owners cannot bypass the public access block
          without elevated approval.
      - id: CCC.ObjStor.CN09.AR03
        text: |
          When an attempt is made to disable the public access block, the
          service MUST require explicit approval from an identity with
          elevated privileges and MUST publish an auditable event to a
          monitored channel.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Implement an approval workflow or secondary authorization
          requirement for disabling public access blocks. Ensure all
          changes are logged and trigger alerts.
      - id: CCC.ObjStor.CN09.AR04
        text: |
          When the public access block is disabled, the service MUST NOT
          permit disabling for any bucket containing objects classified at
          TLP:AMBER or TLP:RED.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Use service control policies or organization-level guardrails to
          permanently enforce public access blocks on buckets containing
          sensitive data.
    threats:
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH01
            remarks: Access is Granted to Unauthorized Users
            strength: 9
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-07
            remarks: Data Protection by Design and Default
            strength: 9
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 7
          - reference-id: IAM-01
            remarks: IAM Policy and Procedures
            strength: 4

  - id: CCC.ObjStor.CN10
    group: Data
    title: Restrict Storage Class Transitions to Approved Tiers
    objective: |
      Ensure that objects cannot be transitioned to storage classes with
      lower durability or availability guarantees without explicit
      authorization, preventing degradation of data resilience through
      misconfigured lifecycle policies or unauthorized actions.
    assessment-requirements:
      - id: CCC.ObjStor.CN10.AR01
        text: |
          When a lifecycle policy is configured to transition objects to a
          different storage class, the service MUST prevent transitions to
          any storage class not included in an organization-defined list of
          approved tiers.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Maintain a list of approved storage classes based on durability
          and availability requirements. Configure service-level policies
          to reject lifecycle rules targeting unapproved classes.
      - id: CCC.ObjStor.CN10.AR02
        text: |
          When a manual request is made to change an object's storage class
          to a tier with lower durability or availability, the service MUST
          require explicit approval from an identity with elevated
          privileges.
        applicability:
          - tlp-amber
          - tlp-red
        recommendation: |
          Implement IAM policies that separate storage class modification
          permissions from general object write permissions. Require
          secondary authorization for downgrades.
      - id: CCC.ObjStor.CN10.AR03
        text: |
          When a storage class transition occurs, the service MUST publish
          an auditable log entry including the identity that initiated the
          transition, the source and destination classes, and the affected
          objects.
        applicability:
          - tlp-green
          - tlp-amber
          - tlp-red
        recommendation: |
          Enable logging for all storage class transitions and integrate
          with monitoring systems to detect unexpected tier changes.
    threats:
      - reference-id: CCC.ObjStor
        entries:
          - reference-id: CCC.ObjStor.TH03
            remarks: Storage Class Downgrade Leading to Durability or Availability Loss
            strength: 9
      - reference-id: CCC
        entries:
          - reference-id: CCC.Core.TH06
            remarks: Data is Lost or Corrupted
            strength: 4
    guidelines:
      - reference-id: CCM
        entries:
          - reference-id: DSP-16
            remarks: Data Retention and Deletion
            strength: 6
          - reference-id: DSP-17
            remarks: Sensitive Data Protection
            strength: 4
          - reference-id: LOG-08
            remarks: Log Records
            strength: 5