# Minimal vars for cloud-api integration tests (integration_calls.csv).

services:
  integration:
    vars:
      provider: azure
      region: westus2
      azure-subscription-id: "${AZURE_SUBSCRIPTION_ID}"
      azure-tenant-id: "${AZURE_TENANT_ID}"
      azure-log-analytics-workspace-id: "${AZURE_LOG_ANALYTICS_WORKSPACE_ID}"
      azure-resource-group: "finos-ccc-integration-rg"
      azure-storage-account: "finoscccintegrationmain"
      default-container: "finos-ccc-integration-container-main"
      object-storage-retention-period-days: 2
      function-name: "finos-ccc-integration-fn-main"
      private-endpoint-url: "https://finos-ccc-integration-fn-main.privatelink.azurewebsites.net/api/HttpTrigger"
      resource: "finos-ccc-integration-vm-main"
      host-name: "${AZURE_VM_HOSTNAME}"
      allowed-requester-vpc-ids:
        - "finos-ccc-integration-vpc-cn03-allow-01"
        - "finos-ccc-integration-vpc-cn03-allow-01"
      disallowed-requester-vpc-ids:
        - "finos-ccc-integration-vpc-bad"
        - "finos-ccc-integration-vpc-bad"
      stale-version-id: "${STALE_VERSION_ID}"
      authorized-region: "westus2"
      unauthorized-region: "westeurope"
      permitted-regions:
        - "westus2"
      azure-key-vault-name: "finoscccintkvsec"
      azure-key-vault-uri: "https://finoscccintkvsec.vault.azure.net/"
      azure-secret-name: "finos-ccc-integration-secret-main"
      # kubernetes — CSV args pass cluster name; resource remains VM for other services.
      # Prefer terraform output: kubernetes.cluster_name / eks.api_endpoint after modules/kubernetes apply.
      cluster-name: "finos-ccc-integration-k8s-main"
      kubernetes-api-hostname: "${AZURE_K8S_API_HOSTNAME}"
      test-workload-namespace: "ccc-test"
      test-workload-service-account: "ccc-wi-sa"
      test-workload-service-account-unbound: "ccc-wi-sa-unbound"
      protected-secret-name: "ccc-protected-secret"
      unrelated-secret-name: "ccc-unrelated-secret"
      webhook-probe-namespace: "ccc-admission-webhook-probe"
      webhook-probe-test-namespace: "ccc-admission-webhook-test"
      webhook-probe-deployment: "ccc-admission-webhook-probe"
      webhook-probe-configuration: "ccc-admission-webhook-probe"
      webhook-probe-enabled-replicas: "1"
      manifest-static-credential: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-static-cred-probe\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    env:\n    - name: AZURE_CLIENT_SECRET\n      value: placeholder-not-a-secret"
      manifest-privileged: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-privileged-probe\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    securityContext:\n      privileged: true"
      manifest-insecure-security-context: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-insecure-sc-probe\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    securityContext:\n      runAsUser: 0\n      allowPrivilegeEscalation: true\n      capabilities:\n        add: [\"SYS_ADMIN\"]"
      manifest-tag-only-image: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-tag-only-probe\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe:latest"
      manifest-privileged-pod: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-cn11-privileged-pod\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    securityContext:\n      privileged: true"
      manifest-privileged-controllers: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ccc-cn11-privileged-deploy\n  namespace: ccc-test\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: ccc-cn11-privileged-deploy\n  template:\n    metadata:\n      labels:\n        app: ccc-cn11-privileged-deploy\n    spec:\n      containers:\n      - name: probe\n        image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n        securityContext:\n          privileged: true"
      manifest-unlabeled-ns-privileged: "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: ccc-admission-unlabeled-probe\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-bypass-pod\n  namespace: ccc-admission-unlabeled-probe\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    securityContext:\n      privileged: true"
      manifest-privileged-deployment-update: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ccc-compliant-deploy\n  namespace: ccc-test\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: ccc-compliant-deploy\n  template:\n    metadata:\n      labels:\n        app: ccc-compliant-deploy\n    spec:\n      containers:\n      - name: probe\n        image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n        securityContext:\n          privileged: true"
      manifest-ephemeral-privileged: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-ephemeral-target\n  namespace: ccc-test\nspec:\n  ephemeralContainers:\n  - name: debugger\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    securityContext:\n      privileged: true"
      manifest-compliant-deployment: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ccc-compliant-deploy\n  namespace: ccc-test\n  labels:\n    Owner: ccc\n    Environment: nonprod\n    DataClassification: internal\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: ccc-compliant-deploy\n  template:\n    metadata:\n      labels:\n        app: ccc-compliant-deploy\n        Owner: ccc\n        Environment: nonprod\n        DataClassification: internal\n    spec:\n      serviceAccountName: ccc-wi-sa\n      securityContext:\n        runAsNonRoot: true\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n      - name: probe\n        image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n        securityContext:\n          allowPrivilegeEscalation: false\n          capabilities:\n            drop: [\"ALL\"]\n          runAsUser: 1000\n        resources:\n          requests:\n            cpu: 50m\n            memory: 64Mi\n          limits:\n            cpu: 100m\n            memory: 128Mi"
      manifest-webhook-compliant: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ccc-webhook-allow\n  namespace: ccc-admission-webhook-test\n  labels:\n    ccc.finos.org/webhook-probe: allow\ndata:\n  ok: \"true\""
      manifest-webhook-reject: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ccc-webhook-deny\n  namespace: ccc-admission-webhook-test\n  labels:\n    ccc.finos.org/webhook-probe: reject\ndata:\n  ok: \"false\""
      manifest-resources-over-limit: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-over-limit\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    resources:\n      requests:\n        cpu: \"32\"\n        memory: 64Gi\n      limits:\n        cpu: \"64\"\n        memory: 128Gi"
      manifest-resources-compliant: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: ccc-resources-ok\n  namespace: ccc-test\nspec:\n  containers:\n  - name: probe\n    image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n    resources:\n      requests:\n        cpu: 50m\n        memory: 64Mi\n      limits:\n        cpu: 100m\n        memory: 128Mi"
      manifest-quota-exceed: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ccc-quota-exceed\n  namespace: ccc-test\nspec:\n  replicas: 100\n  selector:\n    matchLabels:\n      app: ccc-quota-exceed\n  template:\n    metadata:\n      labels:\n        app: ccc-quota-exceed\n    spec:\n      containers:\n      - name: probe\n        image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder\n        resources:\n          requests:\n            cpu: \"1\"\n            memory: 1Gi"
      manifest-missing-required-label: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ccc-missing-label\n  namespace: ccc-test\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: ccc-missing-label\n  template:\n    metadata:\n      labels:\n        app: ccc-missing-label\n    spec:\n      containers:\n      - name: probe\n        image: finoscccintacr.azurecr.io/ccc-probe@sha256:placeholder"
      governance-patch-no-access: "{\"Environment\":\"prod\"}"
      pvc-disallowed-storage-class: "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: ccc-pvc-bad-sc\n  namespace: ccc-test\nspec:\n  accessModes: [\"ReadWriteOnce\"]\n  storageClassName: ccc-blocked-sc\n  resources:\n    requests:\n      storage: 1Gi"
      pvc-disallowed-access-mode: "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: ccc-pvc-bad-mode\n  namespace: ccc-test\nspec:\n  accessModes: [\"ReadWriteMany\"]\n  storageClassName: ccc-approved-sc\n  resources:\n    requests:\n      storage: 1Gi"
      pvc-compliant: "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: ccc-pvc-ok\n  namespace: ccc-test\nspec:\n  accessModes: [\"ReadWriteOnce\"]\n  storageClassName: ccc-approved-sc\n  resources:\n    requests:\n      storage: 1Gi"
