loglevel: info
write-directory: evaluation_results
write: true
output: yaml

# Behavioural config for CCC.K8S against the GCP GKE fixture.
# Populate host-name / logging from terraform outputs after apply:
#   cd modules/cloud-api-test/terraform/gcp && terraform output
# Source modules/cloud-api-test/environment-config/gcp-env.sh for test identities.
# Reachability probe URL/secret come from CI secrets, never commit secrets.

services:
  gcpKubernetes:
    plugin: ccc-behavioural-plugin
    policy:
      catalogs:
        - CCC.K8S
      applicability:
        - tlp-amber
        - tlp-red
    vars:
      service: kubernetes
      service-type: kubernetes
      tags: "@Behavioural @kubernetes"
      provider: gcp
      catalog-versions:
        CCC.Core: v2025.10
        CCC.K8S: DEV
      region: us-east1
      gcp-project-id: "${GCP_PROJECT_ID}"
      gcp-location: us-east1
      kubernetes-cluster-name: "finos-ccc-integration-k8s-main"
      host-name: "${GCP_K8S_API_HOSTNAME}"
      port-number: "443"
      permitted-regions:
        - us-east1
      approved-api-cidrs:
        - "10.0.0.0/8"
      reachability-probe-mode: remote
      reachability-probe-url: "${REACHABILITY_PROBE_URL}"
      reachability-probe-shared-secret: "${REACHABILITY_PROBE_SHARED_SECRET}"
      reachability-probe-observer: finos-public-probe
      reachability-probe-timeout-ms: 5000
      approved-registries:
        - "us-central1-docker.pkg.dev"
      addon-allowlist:
        - httpLoadBalancing
        - horizontalPodAutoscaling
        - networkPolicyConfig
      required-metadata-keys:
        - Owner
        - Environment
        - DataClassification
      approved-storage-classes:
        - ccc-approved-sc
      disallowed-storage-class: ccc-blocked-sc
      approved-access-mode: ReadWriteOnce
      disallowed-access-mode: ReadWriteMany
      pvc-bind-timeout-ms: 60000
      test-workload-namespace: ccc-test
      test-workload-service-account: ccc-wi-sa
      test-workload-service-account-unbound: ccc-wi-sa-unbound
      protected-secret-name: ccc-protected-secret
      unrelated-secret-name: ccc-unrelated-secret
      secret-watch-timeout-ms: 3000
      wi-probe-resource: "finos-ccc-integration-container-main"
      network-control-namespace: ccc-network-control
      network-probe-image: "us-central1-docker.pkg.dev/PROJECT/ccc/ccc-network-probe@sha256:placeholder"
      network-probe-port: 8080
      network-probe-protocol: tcp
      network-allowlist-urls:
        - "http://ccc-allowed.ccc-network-control.svc:8080/health"
      network-denylist-urls:
        - "http://ccc-denied.ccc-network-control.svc:8080/health"
      admission-unlabeled-namespace-prefix: ccc-admission-unlabeled-
      system-namespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - gke-managed-system
      admission-operation-timeout-ms: 30000
      webhook-probe-namespace: ccc-admission-webhook-probe
      webhook-probe-test-namespace: ccc-admission-webhook-test
      webhook-probe-deployment: ccc-admission-webhook-probe
      webhook-probe-service: ccc-admission-webhook-probe
      webhook-probe-configuration: ccc-admission-webhook-probe
      webhook-probe-enabled-replicas: 1
      webhook-probe-timeout-ms: 30000
      kubelet-ports:
        - 10250
        - 10255
      node-probe-timeout-ms: 5000
      node-mgmt-ports:
        - 22
        - 3389
      approved-resource-profile:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      resource-profile-over-limit:
        requests:
          cpu: "32"
          memory: 64Gi
        limits:
          cpu: "64"
          memory: 128Gi
      quota-exceed-profile:
        replicas: 100
        requests:
          cpu: "1"
          memory: 1Gi
      approved-autoscaler-max: 10
      approved-hpa-max-replicas: 10
      hpa-load-profile:
        target-cpu-utilization: 90
      hpa-stabilisation-timeout-ms: 180000
      approved-metadata-values:
        Environment:
          - prod
          - nonprod
      governed-workload-missing-label-profile:
        missing-key: Owner
      legacy-auth-probe-mode: basic
      system-role-prefixes:
        - "system:"
        - "kube-"
      required-infra-roles:
        - node
        - cni
        - csi
        # No cluster-autoscaler identity: fixture pool is fixed-size (no CA).
      approved-image-publishers:
        - google
        - "<approved-image-project>"
      min-supported-node-image: "cos-containerd-v1.29"
      # Admission manifests (server-side dry run only). Each negative manifest
      # violates only the rule its scenario is about; all images are digest-pinned
      # and every container has bounds accepted by ccc-require-resource-bounds.
      unapproved-tag-image-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-unapproved-image
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:latest
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      privileged-workload-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-privileged
          namespace: ccc-test
        spec:
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                privileged: true
      privileged-controller-update-manifest: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ccc-privileged-deploy
          namespace: ccc-test
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ccc-privileged-deploy
          template:
            metadata:
              labels:
                app: ccc-privileged-deploy
            spec:
              containers:
                - name: pause
                  image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
                  resources:
                    requests: { cpu: 50m, memory: 64Mi }
                    limits: { cpu: 100m, memory: 128Mi }
                  securityContext:
                    privileged: true
      insecure-security-context-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-insecure-context
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: true
                capabilities: { drop: ["ALL"] }
      static-credential-workload-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-static-creds
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: "/var/secrets/not-a-real-key.json"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      compliant-no-static-cred-workload-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-no-static-creds
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      missing-resource-bounds-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-missing-bounds
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      compliant-resource-bounds-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-compliant-bounds
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      quota-exceed-workload-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-quota-exceed
          namespace: ccc-test
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          # Each container is within ccc-require-resource-bounds; together they
          # request 2500m CPU against the 2-CPU ccc-quota, so only the quota denies.
          containers:
            - { name: pause-1, image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662", resources: { requests: { cpu: 500m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } } }
            - { name: pause-2, image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662", resources: { requests: { cpu: 500m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } } }
            - { name: pause-3, image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662", resources: { requests: { cpu: 500m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } } }
            - { name: pause-4, image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662", resources: { requests: { cpu: 500m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } } }
            - { name: pause-5, image: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662", resources: { requests: { cpu: 500m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } } }
      disallowed-pvc-manifest: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ccc-disallowed-pvc
          namespace: ccc-test
        spec:
          accessModes: ["ReadWriteMany"]
          resources:
            requests: { storage: 1Gi }
          storageClassName: ccc-blocked-sc
      compliant-pvc-manifest: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ccc-compliant-pvc
          namespace: ccc-test
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 1Gi }
          storageClassName: ccc-approved-sc
      webhook-compliant-probe-manifest: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ccc-webhook-probe
          namespace: ccc-admission-webhook-test
          labels:
            ccc.finos.org/webhook-probe-object: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pause
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
      test-identities:
        test-user-no-access:
          user-name: "${GCP_TEST_USER_NO_ACCESS_NAME}"
          service_account_key: "${GCP_TEST_USER_NO_ACCESS_SA_KEY_JSON}"
        test-user-write:
          user-name: "${GCP_TEST_USER_WRITE_NAME}"
          service_account_key: "${GCP_TEST_USER_WRITE_SA_KEY_JSON}"
        test-user-admin:
          user-name: "${GCP_TEST_USER_ADMIN_NAME}"
          service_account_key: "${GCP_TEST_USER_ADMIN_SA_KEY_JSON}"
