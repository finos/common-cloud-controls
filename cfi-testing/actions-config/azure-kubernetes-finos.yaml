cfi:
  id: azure-kubernetes
  artifact-name: finos-integration-azure-kubernetes
  provider: azure
  source-secrets: AZURE_ENV
  service: kubernetes
  name: CCC Azure Kubernetes Fixture
  description: >-
    Runs behavioural checks for CCC.K8S against the Azure AKS integration fixture.
    Cluster apply/boot is slower than VM/object-storage — allow extended terraform
    and readiness budget in CI.
  path: modules/cloud-api-test/terraform/azure
  test-on-branches:
    - main
  git: https://github.com/finos/common-cloud-controls
  test-configuration: ../privateer-config/finos-integration/kubernetes/azure-kubernetes.yml
  privateer-service: azureKubernetes
