name: Links

on:
  pull_request:
  workflow_call:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Link Checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lychee
          lychee \
            --root-dir "${GITHUB_WORKSPACE}" \
            --verbose \
            --no-progress \
            --max-retries 5 \
            --retry-wait-time 2 \
            --accept '200..=299,429' \
            --output lychee/results.md \
            './**/*.md'
