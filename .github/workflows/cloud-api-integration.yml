name: Cloud API integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/cloud-api/**"
      - "modules/cloud-api-test/**"
      - "modules/probes/**"
      - ".github/workflows/cloud-api-integration.yml"
  push:
    branches:
      - main
    paths:
      - "modules/cloud-api/**"
      - "modules/cloud-api-test/**"
      - "modules/probes/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: cloud-api-integration-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.repository == 'finos/common-cloud-controls'
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp]
    env:
      RUN_CLOUD_API_INTEGRATION: "1"
      PROVIDER: ${{ matrix.provider }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # Do not set AZURE_CLIENT_ID here: DefaultAzureCredential treats it as a
      # user-assigned managed identity and fails the chain before AzureCLICredential.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-workspace

      - name: Configure AWS credentials
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Azure login
        if: matrix.provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # azure/login stores a ~5m GitHub OIDC JWT. AzureCLICredential cannot refresh after it
      # expires (AADSTS700024). Re-login in the background with a fresh id-token.
      - name: Keep Azure CLI OIDC session fresh
        if: matrix.provider == 'azure'
        env:
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          (
            while true; do
              sleep 180
              token="$(curl -fsS \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value')"
              az login --service-principal \
                --tenant "${AZURE_TENANT_ID}" \
                --username "${AZURE_SP_CLIENT_ID}" \
                --federated-token "${token}" \
                --output none
            done
          ) &

      - name: Authenticate to Google Cloud
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          token_format: "id_token"
          id_token_audience: "https://iam.googleapis.com/projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/finos-oidc-pool/providers/github-provider"
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/finos-oidc-pool/providers/github-provider"
          service_account: "gha-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up gcloud
        if: matrix.provider == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Load provider env
        env:
          AWS_ENV: ${{ secrets.AWS_ENV }}
          AZURE_ENV: ${{ secrets.AZURE_ENV }}
          GCP_ENV: ${{ secrets.GCP_ENV }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            aws) payload="${AWS_ENV:-}" ;;
            azure) payload="${AZURE_ENV:-}" ;;
            gcp) payload="${GCP_ENV:-}" ;;
            *) echo "Unknown provider: $PROVIDER" >&2; exit 1 ;;
          esac
          out="modules/cloud-api-test/environment-config/${PROVIDER}-env.sh"
          if [ -n "$payload" ]; then
            printf '%s\n' "$payload" > "$out"
            set -a
            # shellcheck source=/dev/null
            source "$out"
            set +a
            # Persist into subsequent steps
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line#export }"
              case "$line" in
                ''|\#*) continue ;;
                *=*) echo "$line" >> "$GITHUB_ENV" ;;
              esac
            done < "$out"
          else
            echo "Warning: no ${PROVIDER^^}_ENV secret payload" >&2
          fi

      # AZURE_CLIENT_ID in the process env makes DefaultAzureCredential send it to IMDS as a
      # user-assigned identity; that fails fatally on GitHub runners and skips AzureCLICredential.
      - name: Unset AZURE_CLIENT_ID for SDK auth chain
        if: matrix.provider == 'azure'
        run: echo "AZURE_CLIENT_ID=" >> "$GITHUB_ENV"

      - name: Build probe artifacts
        run: |
          set -euo pipefail
          chmod +x modules/probes/build.sh
          ./modules/probes/build.sh

      - name: Start compute fixtures
        env:
          GOCOVERDIR: ${{ github.workspace }}/modules/cloud-api-test/coverage-lifecycle-${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p "$GOCOVERDIR"
          chmod +x modules/cloud-api-test/scale-fixtures.sh
          ./modules/cloud-api-test/scale-fixtures.sh start \
            -c "modules/cloud-api-test/privateer-config/${PROVIDER}.yml" \
            -S integration \
            -s virtual-machines,kubernetes
          # After Start, pin the live VM public IP for Privateer host-name (ephemeral NatIP).
          if [[ "$PROVIDER" == "gcp" ]]; then
            vm_name="finos-ccc-integration-vm-main"
            zone="$(gcloud compute instances list --filter="name=${vm_name}" --format='value(zone.basename())' | head -n1 | tr -d '\n')"
            status="$(gcloud compute instances describe "$vm_name" --zone="$zone" --format='get(status)' | tr -d '\n')"
            ip="$(gcloud compute instances describe "$vm_name" --zone="$zone" --format='get(networkInterfaces[0].accessConfigs[0].natIP)' | tr -d '\n')"
            echo "GCE fixture status=$status zone=$zone natIP=${ip:-<empty>}"
            if [[ "$status" != "RUNNING" && "$status" != "STAGING" ]]; then
              echo "error: GCE fixture $vm_name is $status after scale-fixtures start" >&2
              exit 1
            fi
            if [[ -z "$ip" || "$ip" == "None" || "$ip" == "null" ]]; then
              echo "error: GCE fixture $vm_name has no public NatIP after scale-fixtures start" >&2
              exit 1
            fi
            echo "GCP_VM_HOSTNAME=$ip" >> "$GITHUB_ENV"
          fi

      # Deploy after fixtures are up so webhook pods can schedule onto live nodes.
      - name: Deploy Go probes (AWS)
        if: matrix.provider == 'aws'
        run: |
          set -euo pipefail
          chmod +x modules/probes/deploy-aws.sh
          ./modules/probes/deploy-aws.sh
          # Prefer newest API (avoids stale duplicates). Base URL; client appends /v1/probes.
          api_id="$(aws apigatewayv2 get-apis --query "sort_by(Items[?Name=='finos-ccc-reachability-probe'], &CreatedDate)[-1].ApiId" --output text)"
          api_endpoint="$(aws apigatewayv2 get-api --api-id "$api_id" --query ApiEndpoint --output text)"
          secret="$(aws secretsmanager get-secret-value \
            --secret-id finos-ccc-reachability-probe-shared-secret \
            --query SecretString --output text)"
          {
            echo "REACHABILITY_PROBE_MODE=remote"
            echo "REACHABILITY_PROBE_URL=${api_endpoint}"
            echo "REACHABILITY_PROBE_OBSERVER=finos-public-probe"
            echo "REACHABILITY_PROBE_SHARED_SECRET=${secret}"
          } >> "$GITHUB_ENV"

      - name: Deploy admission-webhook probe (Azure)
        if: matrix.provider == 'azure'
        run: |
          set -euo pipefail
          chmod +x modules/probes/deploy-azure.sh
          ./modules/probes/deploy-azure.sh

      - name: Deploy admission-webhook probe (GCP)
        if: matrix.provider == 'gcp'
        run: |
          set -euo pipefail
          chmod +x modules/probes/deploy-gcp.sh
          ./modules/probes/deploy-gcp.sh

      - name: Run integration tests
        working-directory: modules/cloud-api-test
        run: ./run-integration-tests.sh "$PROVIDER"

      - name: Stop compute fixtures
        if: always()
        env:
          GOCOVERDIR: ${{ github.workspace }}/modules/cloud-api-test/coverage-lifecycle-${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p "$GOCOVERDIR"
          chmod +x modules/cloud-api-test/scale-fixtures.sh
          ./modules/cloud-api-test/scale-fixtures.sh stop \
            -p "$PROVIDER" \
            -s virtual-machines,kubernetes

      - name: Merge lifecycle coverage into integration profile
        if: always()
        working-directory: modules/cloud-api-test
        env:
          LIFECYCLE_GOCOVERDIR: ${{ github.workspace }}/modules/cloud-api-test/coverage-lifecycle-${{ matrix.provider }}
        run: |
          chmod +x ./merge-lifecycle-coverage.sh
          ./merge-lifecycle-coverage.sh "$PROVIDER"

      - name: Publish integration results summary
        if: always()
        run: |
          results="modules/cloud-api-test/integration-results-${PROVIDER}.txt"
          {
            echo "## Cloud API integration (${PROVIDER})"
            echo ""
            if [ -f "$results" ]; then
              echo '```text'
              cat "$results"
              echo '```'
            else
              echo "_No results file at \`$results\`._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-api-integration-${{ matrix.provider }}
          path: |
            modules/cloud-api-test/integration-results-${{ matrix.provider }}.txt
            modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.out
            modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.html
            modules/cloud-api-test/coverage-lifecycle-${{ matrix.provider }}.out
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always() && hashFiles(format('modules/cloud-api-test/coverage-integration-{0}.out', matrix.provider)) != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.out
          flags: cloud-api-integration-${{ matrix.provider }}
          fail_ci_if_error: false
