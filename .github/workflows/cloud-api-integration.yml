name: Cloud API integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/cloud-api/**"
      - "modules/cloud-api-test/**"
      - ".github/workflows/cloud-api-integration.yml"
  push:
    branches:
      - main
    paths:
      - "modules/cloud-api/**"
      - "modules/cloud-api-test/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: cloud-api-integration-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.repository == 'finos/common-cloud-controls'
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp]
    env:
      RUN_CLOUD_API_INTEGRATION: "1"
      PROVIDER: ${{ matrix.provider }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-workspace

      - name: Configure AWS credentials
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Azure login
        if: matrix.provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Google Cloud
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          token_format: "id_token"
          id_token_audience: "https://iam.googleapis.com/projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/finos-oidc-pool/providers/github-provider"
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/finos-oidc-pool/providers/github-provider"
          service_account: "gha-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up gcloud
        if: matrix.provider == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Load provider env
        env:
          AWS_ENV: ${{ secrets.AWS_ENV }}
          AZURE_ENV: ${{ secrets.AZURE_ENV }}
          GCP_ENV: ${{ secrets.GCP_ENV }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            aws) payload="${AWS_ENV:-}" ;;
            azure) payload="${AZURE_ENV:-}" ;;
            gcp) payload="${GCP_ENV:-}" ;;
            *) echo "Unknown provider: $PROVIDER" >&2; exit 1 ;;
          esac
          out="modules/cloud-api-test/environment-config/${PROVIDER}-env.sh"
          if [ -n "$payload" ]; then
            printf '%s\n' "$payload" > "$out"
            set -a
            # shellcheck source=/dev/null
            source "$out"
            set +a
            # Persist into subsequent steps
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line#export }"
              case "$line" in
                ''|\#*) continue ;;
                *=*) echo "$line" >> "$GITHUB_ENV" ;;
              esac
            done < "$out"
          else
            echo "Warning: no ${PROVIDER^^}_ENV secret payload" >&2
          fi

      - name: Fetch AKS kubeconfig
        if: matrix.provider == 'azure'
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group finos-ccc-integration-rg \
            --name finos-ccc-integration-k8s-main \
            --overwrite-existing \
            --file "${RUNNER_TEMP}/aks.kubeconfig"
          if ! command -v kubelogin >/dev/null 2>&1; then
            curl -fsSL -o /tmp/kubelogin.zip \
              "https://github.com/Azure/kubelogin/releases/download/v0.1.9/kubelogin-linux-amd64.zip"
            unzip -o /tmp/kubelogin.zip -d /tmp/kubelogin
            sudo install -m 0755 /tmp/kubelogin/bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          fi
          KUBECONFIG="${RUNNER_TEMP}/aks.kubeconfig" kubelogin convert-kubeconfig -l azurecli
          echo "KUBECONFIG_PATH=${RUNNER_TEMP}/aks.kubeconfig" >> "$GITHUB_ENV"
          echo "KUBECONFIG=${RUNNER_TEMP}/aks.kubeconfig" >> "$GITHUB_ENV"

      - name: Start compute fixtures
        run: |
          set -euo pipefail
          chmod +x modules/cloud-api-test/scale-fixtures.sh
          ./modules/cloud-api-test/scale-fixtures.sh start \
            -c "modules/cloud-api-test/privateer-config/${PROVIDER}.yml" \
            -S integration \
            -s virtual-machines,kubernetes

      - name: Run integration tests
        working-directory: modules/cloud-api-test
        run: ./run-integration-tests.sh "$PROVIDER"

      - name: Stop compute fixtures
        if: always()
        run: |
          set -euo pipefail
          chmod +x modules/cloud-api-test/scale-fixtures.sh
          ./modules/cloud-api-test/scale-fixtures.sh stop \
            -p "$PROVIDER" \
            -s virtual-machines,kubernetes

      - name: Publish integration results summary
        if: always()
        run: |
          results="modules/cloud-api-test/integration-results-${PROVIDER}.txt"
          {
            echo "## Cloud API integration (${PROVIDER})"
            echo ""
            if [ -f "$results" ]; then
              echo '```text'
              cat "$results"
              echo '```'
            else
              echo "_No results file at \`$results\`._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-api-integration-${{ matrix.provider }}
          path: |
            modules/cloud-api-test/integration-results-${{ matrix.provider }}.txt
            modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.out
            modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.html
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always() && hashFiles(format('modules/cloud-api-test/coverage-integration-{0}.out', matrix.provider)) != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modules/cloud-api-test/coverage-integration-${{ matrix.provider }}.out
          flags: cloud-api-integration-${{ matrix.provider }}
          fail_ci_if_error: false
