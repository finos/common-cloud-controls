# Pings a Netlify build hook nightly so the site rebuilds via `website` prebuild
# (fetch:cfi, fetch:ccc, generate:catalogs). Push-triggered auto-deploy, if
# enabled, is configured in Netlify — this workflow only covers the scheduled rebuild.
name: Nightly Netlify Build
on:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch: # allow manual trigger too
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: curl -X POST -s -o /dev/null -w "%{http_code}\n" "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
