name: Gemara Catalog Validation

# Data-correctness validation for Gemara source catalogs: referential
# integrity, id conventions, and mapping completeness. Findings are reported
# inline on the pull request as annotations.
#
# Runs in MONITOR mode (fail-on-error: false): it never fails the PR, it only
# warns. This complements the strict "Gemara Schema Check" workflow, which
# gates merges on schema compilation.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gemara-catalog-validation:
    name: Validate catalog data correctness (warn only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate Gemara catalogs
        uses: sshiells-scottlogic/gemara-catalog-validator@8cd8482339765465379df933e4e11ba619b79025 # v1.0.5
        with:
          # Monitor mode: report findings as inline annotations but never fail
          # the build.
          fail-on-error: false
          # Inline PR annotations.
          format: github
